<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi curso</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#e1e5ea;--ac:#2a62d9;--ok:#1f9d55;--no:#d64545;--wa:#d9890f;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181e;--card:#1d232c;--tx:#e8ecf1;--mu:#93a0b1;--bd:#2c3542;--ac:#6b95f0;--ok:#43c27a;--no:#f07070;--wa:#e9a73e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1200px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:0}h2{font-size:16px;margin:14px 0 8px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:8px 11px}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}
button.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.tabs button{background:var(--card);color:var(--mu);border:1px solid var(--bd);white-space:nowrap;font-weight:500}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px;margin-bottom:9px}
.muted{color:var(--mu);font-size:13px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 7px;border-bottom:1px solid var(--bd);text-align:center;font-size:13px}
th{font-size:12px;font-weight:600;vertical-align:bottom;background:var(--card);position:sticky;top:0;z-index:1}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:2;min-width:160px;font-weight:500}
.cell{width:28px;min-width:28px;height:26px;border:0;background:transparent;text-align:center;font-weight:600;cursor:pointer;border-radius:5px;padding:0;font-size:12px}
.cell.P{background:var(--ok);color:#fff}.cell.A{background:var(--no);color:#fff}.cell.T{background:var(--wa);color:#fff}
.cell.X{background:var(--ok);color:#fff}.cell.O{background:var(--wa);color:#fff}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;font-size:12px;background:var(--bd);color:var(--mu)}
.chip.ok{background:var(--ok);color:#fff}.chip.no{background:var(--no);color:#fff}.chip.wa{background:var(--wa);color:#fff}
.rot{writing-mode:vertical-rl;transform:rotate(180deg);max-height:140px;margin:0 auto;font-weight:500;font-size:11px}
.num{width:44px;min-width:44px;border:1px solid transparent;background:transparent;text-align:center;font-weight:600;padding:4px 2px;border-radius:5px;font-size:12px}
.num:focus{outline:2px solid var(--ac);background:var(--card)}
.num.bad{color:var(--no)}.num.okk{color:var(--ok)}
.num.tea{background:rgba(31,157,85,.18);color:var(--ok)}
.num.tep{background:rgba(217,137,15,.2);color:var(--wa)}
.num.aus{color:var(--mu);font-style:italic}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 12px;font-size:12px;margin-top:6px}
.legend div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp{background:var(--bd);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:9px;background:var(--bd);font-size:12px;margin:2px}
.pill.ok{background:rgba(31,157,85,.18);color:var(--ok)}.pill.no{background:rgba(214,69,69,.15);color:var(--no)}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;display:none;font-size:13px;z-index:99}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:100}
#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:14px;padding:14px;max-width:720px;width:100%;max-height:88vh;overflow:auto;position:relative;padding-top:36px}
#modal .x{position:absolute;top:8px;right:10px;background:transparent;border:0;color:var(--mu);font-size:22px;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:8px}
#modal .x:hover{background:var(--bd);color:var(--tx)}
#modal textarea{width:100%;min-height:140px;font-family:ui-monospace,monospace;font-size:12px}
.mini{font-size:12px;padding:4px 8px}
.hero{text-align:center;padding:30px 14px}
.hero .big{font-size:22px;font-weight:700;margin-bottom:8px}
.hero .btn-file{display:inline-block;background:var(--ac);color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;cursor:pointer;margin-top:10px}
.hero input[type=file]{display:none}
.pl-btn{width:40px;height:36px;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:7px;font-weight:700;font-size:14px;cursor:pointer;padding:0}
.pl-btn.P{background:var(--ok);color:#fff;border-color:var(--ok)}
.pl-btn.A{background:var(--no);color:#fff;border-color:var(--no)}
.pl-btn.T{background:var(--wa);color:#fff;border-color:var(--wa)}
@media print{.tabs,header,button,.noprint{display:none!important}.wrap{overflow:visible}}
</style></head><body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="box"><button class="x" onclick="closeModal()" title="Cerrar">✕</button><div id="modalBox"></div></div></div>
<script>
console.log('Mi curso v6 cargado');
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const KEY='micurso-v5';
const uid=()=>Math.random().toString(36).slice(2,9);
const td=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=d=>d?d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4).slice(2):'';
const fc=c=>c?c.slice(0,4)+'-'+c.slice(4):'';
let D=null,cur=0,tab='asist',edit=false,timer;
let HIST=[];
const C=()=>D.cursos[cur];
const catArr=()=>Object.values(D.circuitos||{}).sort((a,b)=>a.nro-b.nro);
const parseNum=v=>{if(v==null||v==='')return null;const s=String(v).replace(',','.').trim();if(/^-?\d+(\.\d+)?$/.test(s))return parseFloat(s);return null};
const gcls=v=>{if(v==null||v==='')return'';const n=parseNum(v);if(n!=null)return n<6?'bad':'okk';const u=String(v).toUpperCase();return{TEA:'tea',TEP:'tep',A:'aus',X:'aus','-':'aus','XX':'aus'}[u]||''};

function statsAsist(c,s){
 try{
  let p=0,a=0,t=0;
  const asis=c.asistencia||{};
  for(const f in asis){const v=asis[f][s.id];if(!v)continue;if(v==='P')p++;else if(v==='A')a++;else t++}
  const n=p+a+t;return{n,p,a,t,pc:n?Math.round((p+t)/n*100):null};
 }catch(e){return{n:0,p:0,a:0,t:0,pc:null}}
}
const usaCirc=c=>c.usaCirc!==undefined?!!c.usaCirc:Object.keys(c.circuitosHechos||{}).length>0;
function circHechos(c,id){return (c.circuitosHechos||{})[id]||[]}
function temasDe(c){try{return [...new Set((c.evaluaciones||[]).map(e=>e.tema))]}catch(e){return[]}}
function mejorTema(c,id,tema){try{const evs=(c.evaluaciones||[]).filter(e=>e.tema===tema);let best=null;evs.forEach(e=>{const v=((c.notas||{})[id]||{})[e.id];if(v!=null&&v!==''){const n=parseNum(v);if(n!=null&&(best==null||n>best))best=n}});return best}catch(e){return null}}

function tipoTxt(c,e){const t=String(e.tipo==null?'':e.tipo).trim();if(!t||t==='Original')return'';
 if(/^\d+(\.0)?$/.test(t)){const g=(c.evaluaciones||[]).filter(x=>x.tema===e.tema),i=g.indexOf(e);return['Evaluación','Recuperatorio','Recup. final'][i]||('Instancia '+(i+1))}return t}
const evLabel=(c,e)=>e.tema+(tipoTxt(c,e)?' · '+tipoTxt(c,e):'');
function temasEvaluados(c){return temasDe(c).filter(t=>(c.alumnos||[]).some(s=>mejorTema(c,s.id,t)!=null))}
function temasPend(c,id){return temasEvaluados(c).filter(t=>{const m=mejorTema(c,id,t);return m==null||m<6})}
const chipE=e=>e==='Aprobado'?'<span class="chip ok">Aprobado</span>':e==='A recuperar'?'<span class="chip no">A recuperar</span>':'<span class=chip>Sin datos</span>';
function bannerBackup(){let t=null;try{t=localStorage.getItem('micurso-backup')}catch(e){}
 const dias=t?Math.floor((Date.now()-new Date(t))/864e5):null;if(dias!==null&&dias<7)return'';
 return`<div class=card style="border-color:var(--wa);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span>💾 ${dias===null?'Todavía no descargaste ninguna copia de seguridad.':'Hace '+dias+' días que no descargás una copia de seguridad.'} Tus datos viven solo en este navegador.</span><button class=mini onclick="expJSON()">Descargar copia ahora</button></div>`}

const CUATRIS=['1er','2do','3ro','4to'];
function cierreFinal(c,id){
 try{
  const cc=(c&&c.cierres&&c.cierres[id])||{};
  const nums=[];let bajo=false,tea=false;
  CUATRIS.forEach(k=>{
   const v=cc[k];
   if(v==null||v==='')return;
   const n=parseNum(v);
   if(n!=null){nums.push(n);if(n<6)bajo=true}
   else{const u=String(v).toUpperCase();if(u==='TEA')tea=true}
  });
  const prom=nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:null;
  let estado='';
  if(nums.length===0&&!tea)estado='Sin datos';
  else if(bajo)estado='A recuperar';
  else if(prom!=null&&prom<6)estado='A recuperar';
  else if(prom!=null||tea)estado='Aprobado';
  return{prom:prom!=null?Math.round(prom*10)/10:null,estado};
 }catch(e){return{prom:null,estado:'Sin datos'}}
}

function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);const old=localStorage.getItem('micurso-v4');if(old)return JSON.parse(old)}catch(e){}return null}
function save(){clearTimeout(timer);timer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('No se pudo guardar')}programarSync()},250)}
function pushH(){HIST.push(JSON.stringify(D)+'§'+cur);if(HIST.length>40)HIST.shift()}
function undo(){if(!HIST.length){toast('Nada para deshacer');return}const s=HIST.pop(),i=s.lastIndexOf('§');D=JSON.parse(s.slice(0,i));cur=parseInt(s.slice(i+1))||0;if(cur>=D.cursos.length)cur=0;save();render();toast('Deshecho')}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}

function setTab(k){tab=k;render()}

function render(){
 const app=$('#app');
 try{
  if(!D){app.innerHTML=`<div class=hero><div class=big>🎓 Mi curso</div><p class=muted>Cargá el archivo de datos para empezar.</p><label class=btn-file>📂 Cargar datos-2026.json<input type=file accept=".json" onchange="loadJSON(this)"></label><p class=muted style="margin-top:20px">o <a href="#" onclick="blank();return false">empezar vacío</a></p><p class=muted>¿Ya usás la nube? <a href="#" onclick="openNube();return false">☁️ Conectar y restaurar mis datos</a></p></div>`;return}
  const c=C();
  if(!c){app.innerHTML='<div class=card><b>No hay cursos.</b><p class=muted>Creá uno nuevo o recuperá el último con Deshacer.</p><div class=row><button onclick="nuevoAnio()">➕ Crear curso</button><button class=ghost onclick="undo()">↶ Deshacer</button><button class=ghost onclick="openImportJSON()">📂 Cargar JSON</button></div></div>';return}
  let h=`<header><h1>🎓 Mi curso</h1><div class=row>
   ${D.cursos.length?`<select onchange="cur=+this.value;render()">${D.cursos.map((x,i)=>`<option value=${i} ${i==cur?'selected':''}>${esc(x.nombre)} (${x.anio})</option>`).join('')}</select>`:''}
   <button class=ghost onclick="expJSON()">⬇ Exportar JSON</button>
   <button class=ghost id=nubeChip onclick="openNube()">${nubeTxt()}</button>
   <button class=ghost onclick="publicarPadres()">📤 Publicar para padres</button>
   <button class=ghost onclick="openImportXlsx()">📥 Importar Excel</button>
   <button class=ghost onclick="openImportJSON()">📂 Cargar JSON</button>
   <button class=ghost onclick="nuevoAnio()">📅 Nuevo curso / año</button>
   <button class=ghost onclick="undo()">↶ Deshacer</button>
   <button class=ghost onclick="toggleEdit()">${edit?'✏️ Editando':'🔒 Ver'}</button>
  </div></header>`;
  h+=bannerBackup();
  h+=`<div class=tabs>${[['asist','Asistencia'],['circ','Circuitos'],['eval','Evaluaciones'],['cie','Cierres'],['obs','Observaciones'],['alum','Alumnos'],['rep','Reportes'],['pad','Padres']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div>`;
  h+=`<div class=muted style="margin-bottom:6px">${esc(c.materia||'')}${c.docente?' · '+esc(c.docente):''} · ${(c.alumnos||[]).length} alumnos · ${c.anio||''}</div>`;
  let fn=null;
  if(tab==='asist')fn=vAsist;
  else if(tab==='circ')fn=vCirc;
  else if(tab==='eval')fn=vEval;
  else if(tab==='cie')fn=vCie;
  else if(tab==='alum')fn=vAlum;
  else if(tab==='rep')fn=vRep;
  else if(tab==='pad')fn=vPad;
  else if(tab==='obs')fn=vObs;
  if(!fn){tab='asist';fn=vAsist;}
  let body='';
  try{body=fn(c)}
  catch(e){console.error('Error en pestaña '+tab,e);body='<div class=card style="border-color:var(--no)"><b style="color:var(--no)">Error en esta pestaña</b><div class=muted>'+esc(e&&e.message||String(e))+'</div><div class=muted>Abrí F12 → Console para el detalle.</div></div>'}
  h+=body;
  app.innerHTML=h;
 }catch(e){
  console.error('Error general de render',e);
  app.innerHTML='<div class=card style="border-color:var(--no)"><b style="color:var(--no)">Error al dibujar la app</b><div class=muted>'+esc(e&&e.message||String(e))+'</div><div class=muted>Probá recargar (Ctrl+F5). Si persiste, abrí F12 → Console y pasame el error.</div></div>';
 }
}

// ============ ASISTENCIA ============
let asisFiltro='';
function vAsist(c){
 const fechas=Object.keys(c.asistencia||{}).sort();
 const total=(c.alumnos||[]).length;
 let h=`<div class=card>
   <div class=row style="justify-content:space-between;margin-bottom:8px">
     <b>Asistencia</b>
     <span class=muted>${fechas.length} clases · ${total} alumnos</span>
   </div>
   <div class=row style="margin-bottom:8px">
     <input type=date id=asisFecha value="${asisFiltro||td()}" onchange="asisFiltro=this.value;render()">
     <button class=ghost onclick="asisFiltro='';render()">Ir a hoy</button>
     <button onclick="nuevaClase()">➕ Nueva clase</button>
     <button onclick="pasarListaHoy()">📅 Pasar lista de hoy</button>
     <button class=ghost onclick="abrirCompletar()">📆 Completar semanas</button>
     ${edit?'<span class="chip no">✏️ Edición activa</span>':'<span class=chip>🔒 Ver (activá ✏️ para editar)</span>'}
   </div>
 </div>`;
 h+='<div class="card wrap"><table><thead><tr><th>Alumno</th>';
 fechas.forEach(f=>{
   const esSel=f===asisFiltro?'style="background:var(--ac);color:#fff"':'';
   h+=`<th ${esSel}><div class=rot>${fd(f)}</div>${edit?`<a href="#" onclick="delFecha('${f}');return false" title="Borrar fecha" style="color:var(--no);text-decoration:none;font-size:10px">✕</a>`:''}</th>`;
 });
 h+='<th>%</th><th>P</th><th>A</th><th>T</th></tr></thead><tbody>';
 (c.alumnos||[]).forEach(s=>{
  const st=statsAsist(c,s);
  h+=`<tr><td>${esc(s.nombre)}</td>`;
  fechas.forEach(f=>{const v=((c.asistencia||{})[f]||{})[s.id]||'';h+=`<td><button class="cell ${v}" onclick="setA('${f}','${s.id}')">${v||'·'}</button></td>`});
  h+=`<td><span class="chip ${st.pc<75?'no':st.pc<85?'wa':'ok'}">${st.pc??'-'}%</span></td><td>${st.p}</td><td>${st.a}</td><td>${st.t}</td></tr>`;
 });
 h+='</tbody></table></div>';
 return h;
}
function setA(f,id){
 if(!edit){toast('Activá edición (✏️)');return}
 pushH();const c=C();c.asistencia=c.asistencia||{};c.asistencia[f]=c.asistencia[f]||{};
 const o=['','P','A','T'];const cur=c.asistencia[f][id]||'';
 c.asistencia[f][id]=o[(o.indexOf(cur)+1)%4];
 if(!c.asistencia[f][id])delete c.asistencia[f][id];
 save();render();
}
function nuevaClase(){
 if(!edit){toast('Activá edición (✏️)');return}
 const f=(asisFiltro||($('#asisFecha')&&$('#asisFecha').value)||td()).slice(0,10);
 if(!/^\d{4}-\d{2}-\d{2}$/.test(f)){toast('Fecha inválida');return}
 const c=C();c.asistencia=c.asistencia||{};
 if(c.asistencia[f]){toast('Esa fecha ya existe');asisFiltro=f;render();return}
 pushH();c.asistencia[f]={};asisFiltro=f;save();render();
 toast('Clase '+fd(f)+' agregada');
}
function delFecha(f){
 if(!edit){toast('Activá edición');return}
 if(!confirm('¿Borrar la clase del '+fd(f)+' y sus marcas?'))return;
 pushH();delete C().asistencia[f];if(asisFiltro===f)asisFiltro='';save();render();
}
function pasarListaHoy(){
 if(!edit){toast('Activá edición (✏️)');return}
 const f=td();const c=C();c.asistencia=c.asistencia||{};
 if(!c.asistencia[f]){pushH();c.asistencia[f]={};}
 asisFiltro=f;
 const alumnos=(c.alumnos||[]).slice();
 const day=c.asistencia[f]||{};
 let html=`<h2>Pasar lista — ${fd(f)}</h2>
  <p class=muted>Marcá P / A / T por alumno. Queda resaltado lo que elegiste.</p>
  <div class=row style="margin-bottom:8px">
    <button class=ghost onclick="marcarTodos('P')">Todos P</button>
    <button class=ghost onclick="marcarTodos('A')">Todos A</button>
    <button class=ghost onclick="marcarTodos('T')">Todos T</button>
    <button class=ghost onclick="limpiarDia()">Limpiar</button>
  </div>
  <div style="max-height:60vh;overflow:auto">`;
 alumnos.forEach(s=>{
   const v=day[s.id]||'';
   html+=`<div class="pl-row" data-id="${s.id}" style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)">
     <span style="flex:1;padding-right:8px">${esc(s.nombre)}</span>
     <span class=row style="gap:4px">
       <button class="pl-btn ${v==='P'?'P':''}" data-v="P" onclick="markPL('${s.id}','P')">P</button>
       <button class="pl-btn ${v==='A'?'A':''}" data-v="A" onclick="markPL('${s.id}','A')">A</button>
       <button class="pl-btn ${v==='T'?'T':''}" data-v="T" onclick="markPL('${s.id}','T')">T</button>
     </span>
   </div>`;
 });
 html+=`</div><div class=row style="margin-top:10px"><button onclick="closeModal();render()">Guardar y cerrar</button><button class=ghost onclick="closeModal();render()">Cancelar</button></div>`;
 $('#modalBox').innerHTML=html;$('#modal').classList.add('on');
}
function markPL(id,val){
 const f=td();const c=C();c.asistencia=c.asistencia||{};c.asistencia[f]=c.asistencia[f]||{};
 if(c.asistencia[f][id]===val)delete c.asistencia[f][id];
 else c.asistencia[f][id]=val;
 save();
 const row=document.querySelector(`.pl-row[data-id="${id}"]`);
 if(row){
   const actual=c.asistencia[f][id]||'';
   row.querySelectorAll('.pl-btn').forEach(b=>b.classList.toggle(b.dataset.v,b.dataset.v===actual));
 }
}
function marcarTodos(v){
 const f=td();const c=C();c.asistencia=c.asistencia||{};c.asistencia[f]=c.asistencia[f]||{};
 (c.alumnos||[]).forEach(s=>{if(v===''||v==null)delete c.asistencia[f][s.id];else c.asistencia[f][s.id]=v});
 save();
 document.querySelectorAll('.pl-row').forEach(row=>{
   const id=row.dataset.id;
   const actual=c.asistencia[f][id]||'';
   row.querySelectorAll('.pl-btn').forEach(b=>b.classList.toggle(b.dataset.v,b.dataset.v===actual));
 });
}
function limpiarDia(){marcarTodos('')}
function abrirCompletar(){
 if(!edit){toast('Activá edición (✏️)');return}
 const c=C();const fechas=Object.keys(c.asistencia||{}).sort();
 const ult=fechas[fechas.length-1]||td();
 $('#modalBox').innerHTML=`<h2>Completar semanas</h2>
 <p class=muted>Agrega todas las fechas que falten entre el rango, con la periodicidad indicada.</p>
 <div class=row style="margin:8px 0">
   <label>Desde <input type=date id=desde value="${ult}"></label>
   <label>Hasta <input type=date id=hasta value="2026-12-30"></label>
   <label>Cada <input type=number id=paso value=7 min=1 max=30 style="width:60px"> días</label>
 </div>
 <div class=row><button onclick="doCompletar()">Agregar faltantes</button><button class=ghost onclick="closeModal()">Cancelar</button></div>
 <div id=compPv class=muted style="margin-top:8px"></div>`;
 $('#modal').classList.add('on');
}
function doCompletar(){
 const c=C();c.asistencia=c.asistencia||{};
 const desde=$('#desde').value,hasta=$('#hasta').value,paso=parseInt($('#paso').value)||7;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(desde)||!/^\d{4}-\d{2}-\d{2}$/.test(hasta)){toast('Fechas inválidas');return}
 if(desde>hasta){toast('Rango invertido');return}
 let d=new Date(desde+'T12:00:00');const fin=new Date(hasta+'T12:00:00');
 const nuevas=[];let guard=0;
 while(d<=fin&&guard<400){const s=d.toISOString().slice(0,10);if(!c.asistencia[s])nuevas.push(s);d.setDate(d.getDate()+paso);guard++}
 if(!nuevas.length){$('#compPv').textContent='No hay fechas faltantes en ese rango.';return}
 if(!confirm('Agregar '+nuevas.length+' fechas nuevas?'))return;
 pushH();nuevas.forEach(s=>c.asistencia[s]={});save();closeModal();render();toast('Agregadas '+nuevas.length+' clases');
}

function tgC(id,cidv){
 if(!edit){toast('Activá edición');return}
 const c=C();

 const cat=D.circuitos?D.circuitos[cidv]:null;

function intercambiar25y26(){
 if(!edit){toast('Activá edición');return}
 if(!D||!D.cursos||!D.cursos.length){toast('No hay cursos');return}
 if(!confirm('¿Intercambiar los circuitos 25 y 26 en TODOS los cursos?\n\nSe usa para corregir la planilla cuando quedaron cargados al revés.'))return;
 let cambiados=0;
 D.cursos.forEach(c=>{
  if(!c.circuitosHechos)return;
  Object.keys(c.circuitosHechos).forEach(alId=>{
   const arr=c.circuitosHechos[alId]||[];
   const tiene25=arr.includes('c25');
   const tiene26=arr.includes('c26');
   if(tiene25===tiene26)return;
   if(tiene25)c.circuitosHechos[alId]=arr.filter(x=>x!=='c25').concat('c26');
   else c.circuitosHechos[alId]=arr.filter(x=>x!=='c26').concat('c25');
   cambiados++;
  });
 });
 if(!cambiados){toast('No había 25/26 para intercambiar');return}
 pushH();

function toggleEdit(){edit=!edit;clearTimeout(window._e);if(edit)window._e=setTimeout(()=>{edit=false;render()},10*60000);render()}
// ---- lista de alumnos desde Excel / texto ----
const NO_NOMBRE=/^(n[°º.]?|nro\.?|n[úu]mero|total(es)?|presentes?|ausentes?|tarde|promedio|porcentaje|varones|mujeres|alumnos?|estudiantes?|apellidos?|nombres?|apellido y nombre|nombre y apellido|d\.?n\.?i\.?|legajo|curso|fecha|docente|materia|leyenda)(?![A-Za-zÁÉÍÓÚÜÑáéíóúüñ])/i;
const esNombre=s=>{s=String(s==null?'':s).trim();return s.length>=4&&/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{2}/.test(s)&&!/^\d+([.,]\d+)?$/.test(s)&&!NO_NOMBRE.test(s)};
const limpiaNombre=s=>String(s==null?'':s).replace(/[?¿]/g,'').replace(/\s+/g,' ').replace(/[,;]+\s*$/,'').trim();
function unicos(arr){const seen=new Set(),out=[];arr.forEach(n=>{const k=normNombre(n);if(k&&!seen.has(k)){seen.add(k);out.push(n)}});return out}
function listaDesdeTexto(txt){return unicos(String(txt||'').split(/\r?\n/).map(limpiaNombre).filter(esNombre))}
function parseListaAlumnos(rows){
 rows=(rows||[]).map(r=>(Array.isArray(r)?r:[]).map(x=>x==null?'':String(x).trim()));
 let ape=-1,nom=-1,uni=-1,hr=-1;
 for(let r=0;r<Math.min(rows.length,12);r++){
  ape=nom=uni=-1;
  rows[r].forEach((v,i)=>{const l=v.toLowerCase();
   if(/^apellidos?$/.test(l))ape=i;
   else if(/^nombres?$/.test(l))nom=i;
   else if(/^(apellido\s*(y|,)\s*nombres?|nombres?\s*y\s*apellido|alumn[oa]s?|estudiantes?|nombre completo)$/.test(l))uni=i});
  if(ape>=0||nom>=0||uni>=0){hr=r;break}
 }
 let col=-1,start=0;const W=Math.max(0,...rows.map(r=>r.length));
 if(hr>=0){start=hr+1;col=(ape>=0&&nom>=0)?-1:(uni>=0?uni:(ape>=0?ape:nom))}
 else{
  for(let c=0;c<Math.min(W,3)&&col<0;c++){
   const nums=rows.map((r,i)=>[i,/^\d{1,3}(\.0)?$/.test(r[c]||'')?parseInt(r[c]):-1]).filter(x=>x[1]>=0);
   if(nums.length>=5&&nums[0][1]<=2){col=c+1;start=nums[0][0]}
  }
  if(col<0){let best=0;for(let c=0;c<Math.min(W,6);c++){const n=rows.filter(r=>esNombre(r[c])).length;if(n>best){best=n;col=c}}}
 }
 const out=[];
 for(let r=start;r<rows.length;r++){
  const row=rows[r],n=limpiaNombre((hr>=0&&ape>=0&&nom>=0)?[row[ape],row[nom]].filter(Boolean).join(', '):row[col]);
  if(esNombre(n))out.push(n);
 }
 return unicos(out);
}
function ensureXLSX(ok){
 if(window.XLSX)return ok();toast('Cargando lector de Excel…');
 const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js';
 s.onload=ok;s.onerror=()=>toast('Sin internet: no se pudo cargar el lector de Excel. Escribí o pegá la lista abajo.');document.head.appendChild(s)}
function contarLista(ta,msg){const m=document.getElementById(msg),n=listaDesdeTexto(document.getElementById(ta).value).length;if(m)m.textContent=n?n+' alumnos en la lista':''}
function bloqueLista(ta,msg){return`<div class=row style="margin:6px 0"><label style="display:inline-block;background:var(--ac);color:#fff;padding:9px 14px;border-radius:9px;font-weight:600;cursor:pointer">📂 Subir Excel con la lista<input type=file accept=".xlsx,.xls,.csv,.txt" onchange="leerListaArchivo(this,'${ta}','${msg}')" style="display:none"></label><span id=${msg} class=muted></span></div>
 <textarea id=${ta} oninput="contarLista('${ta}','${msg}')" placeholder="Un alumno por línea (Apellido, Nombre)" style="width:100%;min-height:150px"></textarea>
 <p class=muted>El Excel puede tener una columna “Apellido y nombre” o dos columnas, Apellido y Nombre. Revisá la lista: podés corregirla acá antes de crear.</p>`}
function leerListaArchivo(inp,ta,msg){
 const f=inp.files[0];if(!f)return;const m=document.getElementById(msg);
 const poner=(names,de)=>{document.getElementById(ta).value=names.join('\n');if(m)m.textContent=names.length+' alumnos encontrados'+(de?' en '+de:'')+'. Revisalos abajo.'};
 const r=new FileReader();
 if(/\.txt$/i.test(f.name)){r.onload=e=>poner(listaDesdeTexto(e.target.result),f.name);r.readAsText(f);return}
 ensureXLSX(()=>{
  r.onload=e=>{try{
   const wb=XLSX.read(e.target.result,{type:'array'});let found=null,hoja='';
   for(const n of wb.SheetNames){const names=parseListaAlumnos(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}));if(names.length>=3){found=names;hoja=n;break}}
   if(!found)throw new Error('no encontré una lista de alumnos');poner(found,'la hoja “'+hoja+'”');
  }catch(x){if(m)m.textContent='No pude leer la lista ('+x.message+'). Escribila o pegala abajo.'}};
  r.readAsArrayBuffer(f)})
}

// ============ PUBLICAR PARA PADRES (v2: cifrado reforzado) ============
const PUB_E=new TextEncoder();
const pubB64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const pubHex=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');
async function pubKdf(code,salt,it){const b=await crypto.subtle.importKey('raw',PUB_E.encode(code),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},b,256))}
async function pubH(k,tag){const t=PUB_E.encode(tag),m=new Uint8Array(k.length+t.length);m.set(k);m.set(t,k.length);return new Uint8Array(await crypto.subtle.digest('SHA-256',m))}
async function pubIdx(k){return pubHex((await pubH(k,'idx')).slice(0,12))}
async function pubSeal(k,o){const iv=crypto.getRandomValues(new Uint8Array(12)),ek=await crypto.subtle.importKey('raw',await pubH(k,'enc'),'AES-GCM',false,['encrypt']);return{i:pubB64(iv),c:pubB64(await crypto.subtle.encrypt({name:'AES-GCM',iv},ek,PUB_E.encode(JSON.stringify(o))))}}
function pubPayload(c,s){
 let p=0,a=0,t=0;const last=[];
 Object.keys(c.asistencia||{}).sort().forEach(d=>{const v=((c.asistencia||{})[d]||{})[s.id];if(v){v==='P'?p++:v==='A'?a++:t++;last.push([d,v])}});
 const conCirc=usaCirc(c);
 const circ=conCirc?catArr().map(x=>{const id='c'+String(x.nro).padStart(2,'0');return[x.nro+' — '+x.nombre,circHechos(c,s.id).includes(id)]}):[];
 const gr=(c.evaluaciones||[]).map(e=>[evLabel(c,e),((c.notas||{})[s.id]||{})[e.id]]).filter(x=>x[1]!==undefined&&x[1]!=='');
 const cie=(c.cierres||{})[s.id]||{};
 return{n:s.nombre,c:c.nombre,m:c.materia||'',u:td(),p,a,t,last:last.slice(-12).reverse(),circ,gr,cie,fin:cierreFinal(c,s.id).prom,rec:temasPend(c,s.id),obs:obsPublic(c,s.id)};
}
let _pub=false;
async function publicarPadres(){
 if(nubeOK()){publicarNube('todo');return}
 if(_pub)return;
 if(!D||!D.cursos.length){toast('No hay cursos');return}
 const lista=[];D.cursos.forEach(c=>(c.alumnos||[]).forEach(s=>{if(s.codigo&&!s.baja)lista.push([c,s])}));
 if(!lista.length){toast('No hay alumnos con código');return}
 _pub=true;
 try{

  for(const[c,s]of lista){
   toast('Generando '+(++n)+' de '+lista.length+'… (puede tardar un minuto)');
   const k=await pubKdf(s.codigo,salt,IT);
   snap[await pubIdx(k)]=await pubSeal(k,pubPayload(c,s));
  }
  const payload={v:2,generado:new Date().toISOString(),it:IT,salt:pubB64(salt),cursos:D.cursos.length,alumnos:lista.length,snap};
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='datos-padres.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Listo: '+lista.length+' alumnos. Subí datos-padres.json junto a index.html');
 }catch(e){console.error(e);toast('No se pudo generar el archivo')}
 finally{_pub=false}
}

// ============ NUBE (servidor propio en Google Apps Script) ============
const NK='micurso-nube',KC='micurso-kc',PH='micurso-pubhash';
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let NB=lsGet(NK,null),nubeEstado='',nubeTimer=null,nubeBusy=false,_ek=null;
const nubeOK=()=>!!(NB&&NB.url&&NB.token);
const nubeTxt=()=>nubeOK()?'☁️ '+(nubeEstado||'Conectada'):'☁️ Nube';
function pintaNube(){const e=document.getElementById('nubeChip');if(e)e.textContent=nubeTxt()}
const pubUb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pubOpen(k,e){const ek=await crypto.subtle.importKey('raw',await pubH(k,'enc'),'AES-GCM',false,['decrypt']);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:pubUb(e.i)},ek,pubUb(e.c))))}
async function apiPost(a,body){
 const r=await fetch(NB.url,{method:'POST',body:JSON.stringify(Object.assign({t:NB.token,a},body||{}))});
 try{return await r.json()}catch(e){throw new Error('el servidor no respondió como se esperaba (revisá que el acceso sea “Cualquier persona”)')}
}
async function hashStr(s){return pubHex(new Uint8Array(await crypto.subtle.digest('SHA-256',PUB_E.encode(s)))).slice(0,16)}
async function nubeKey(code){let kc=lsGet(KC,{});if(kc.salt!==NB.salt||kc.it!==NB.it)kc={salt:NB.salt,it:NB.it,k:{}};
 if(!kc.k[code]){kc.k[code]=pubB64(await pubKdf(code,pubUb(NB.salt),NB.it));lsSet(KC,kc)}return pubUb(kc.k[code])}
async function estadoKey(){if(!_ek)_ek=await pubKdf(NB.token,PUB_E.encode('micurso-estado'),300000);return _ek}
function programarSync(){if(!nubeOK()||!NB.auto||!D)return;nubeEstado='Pendiente…';pintaNube();clearTimeout(nubeTimer);nubeTimer=setTimeout(()=>publicarNube(false),6000)}
async function nubeGuardarEstado(force){
 const k=await estadoKey(),blob=JSON.stringify(await pubSeal(k,D)),r=await apiPost('save',{blob,base:NB.lastState||'',force:!!force});
 if(r.ok){NB.lastState=r.ts;lsSet(NK,NB);return 'ok'}
 if(r.err==='conflicto')return 'conflicto';
 throw new Error(r.err==='clave'?'la clave no coincide con la del servidor':(r.err||'no se pudo guardar la copia'));
}
async function publicarNube(modo){
 if(!nubeOK()||!D||nubeBusy)return;nubeBusy=true;nubeEstado='Sincronizando…';pintaNube();
 try{
  if(await nubeGuardarEstado(false)==='conflicto'){nubeEstado='⚠ Conflicto';toast('La nube tiene datos más nuevos de otro dispositivo. Abrí ☁️ y elegí Restaurar o Sobrescribir.');return}
  const lista=[];D.cursos.forEach(c=>(c.alumnos||[]).forEach(s=>{if(s.codigo&&!s.baja)lista.push([c,s])}));
  const ph=lsGet(PH,{}),nuevos={},items={},keep=[];let n=0;
  for(const[c,s]of lista){
   const kc=lsGet(KC,{});if(!(kc.salt===NB.salt&&kc.it===NB.it&&kc.k&&kc.k[s.codigo])){nubeEstado='Preparando '+(++n)+'…';pintaNube()}
   const k=await nubeKey(s.codigo),idx=await pubIdx(k),pl=pubPayload(c,s),h=await hashStr(JSON.stringify(Object.assign({},pl,{u:''})));
   keep.push(idx);nuevos[idx]=h;if(modo==='todo'||ph[idx]!==h)items[idx]=await pubSeal(k,pl);
  }
  const r=await apiPost('pub',{salt:NB.salt,it:NB.it,items,keep});
  if(!r.ok)throw new Error(r.err==='clave'?'la clave no coincide con la del servidor':(r.err||'respuesta inválida'));
  lsSet(PH,nuevos);
  nubeEstado='Sincronizado '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  if(modo)toast('Listo: '+Object.keys(items).length+' alumnos actualizados en la nube');
 }catch(e){console.error(e);nubeEstado='Error de conexión';if(modo)toast('No se pudo sincronizar: '+(e&&e.message||e))}
 finally{nubeBusy=false;pintaNube()}
}
async function nubeRestaurar(){
 if(!nubeOK()){toast('Primero guardá la conexión');return}
 try{
  const r=await apiPost('state');if(!r.ok||!r.blob){toast('Todavía no hay una copia guardada en la nube');return}
  let o;try{o=await pubOpen(await estadoKey(),JSON.parse(r.blob))}catch(e){throw new Error('la clave no corresponde a esta copia')}
  if(!o||!Array.isArray(o.cursos))throw new Error('copia inválida');
  if(!confirm('¿Reemplazar los datos de ESTE dispositivo por la copia de la nube ('+new Date(r.ts).toLocaleString('es-AR')+')? Se puede deshacer con ↶.'))return;
  if(D)pushH();D=o;cur=0;NB.lastState=r.ts;lsSet(NK,NB);save();render();closeModal();toast('Datos restaurados desde la nube')
 }catch(e){toast('No se pudo restaurar: '+(e&&e.message||e))}
}
async function nubeSobrescribir(){
 if(!confirm('¿Reemplazar la copia de la nube con los datos de ESTE dispositivo?'))return;
 try{await nubeGuardarEstado(true);toast('La nube ahora tiene los datos de este dispositivo');publicarNube('todo')}catch(e){toast('No se pudo: '+(e&&e.message||e))}
}

 catch(e){const b=document.getElementById('nbCode');b.style.display='block';b.value=code;b.select();toast('Copiá el texto que apareció abajo')}

function readXlsx(inp){
 const f=inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=e=>{
  try{
   const wb=XLSX.read(e.target.result,{type:'array'});
   _imp={wb,cur:parseInt($('#impCur').value)||0,hojas:{}};
   const pv=[];
   wb.SheetNames.forEach(n=>{
    const sh=wb.Sheets[n];
    const rows=XLSX.utils.sheet_to_json(sh,{header:1,defval:''});
    const tipo=detectarHoja(rows,n);
    if(tipo)_imp.hojas[tipo]=rows;
    pv.push(`<div><b>${esc(n)}</b>: ${rows.length} filas → ${tipo?('detectada como <b>'+tipo+'</b>'):'ignorada'}</div>`);
   });
   const prev=previewFusion(_imp.hojas);
   $('#impPv').innerHTML=pv.join('')+'<hr>'+prev;
   $('#impBtns').innerHTML=`<button onclick="aplicarImport()">Fusionar con el curso</button><button class=ghost onclick="closeModal()">Cancelar</button>`;
  }catch(x){toast('No se pudo leer el archivo');console.error(x)}
 };
 r.readAsArrayBuffer(f);
}
function detectarHoja(rows,name){
 const low=(name||'').toLowerCase();
 if(/asist|presente|falta/.test(low))return 'asistencia';
 for(let r=0;r<Math.min(rows.length,6);r++){
  const celdas=rows[r]||[];
  const fechas=celdas.filter(x=>esFecha(x)).length;
  if(fechas>=3)return 'asistencia';
 }
 if(/nota/.test(low))return 'notas';
 for(let r=0;r<Math.min(rows.length,6);r++){
  const c=rows[r]||[];
  if(c.some(x=>String(x).toLowerCase()==='nombre'))return 'notas';
 }
 return null;
}
function esFecha(x){
 if(x instanceof Date)return true;
 if(typeof x==='number'&&x>40000&&x<60000)return true;
 if(typeof x==='string'&&/^\d{4}-\d{2}-\d{2}/.test(x))return true;
 return false;
}
function fechaNorm(x){
 if(x instanceof Date)return x.toISOString().slice(0,10);
 if(typeof x==='number'){const d=new Date(Date.UTC(1899,11,30)+x*86400000);return d.toISOString().slice(0,10)}
 if(typeof x==='string'){const m=x.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3]}
 return null;
}
function normNombre(s){return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function previewFusion(hojas){
 const c=C();if(!c)return '<div class=muted>Sin curso destino.</div>';
 let nuevasFechas=0,alumnosNuevos=0;
 if(hojas.asistencia){
  const {fechas,alumnos}=parseAsistencia(hojas.asistencia);
  fechas.forEach(f=>{if(!(c.asistencia||{})[f])nuevasFechas++});
  alumnos.forEach(a=>{if(!(c.alumnos||[]).find(x=>normNombre(x.nombre)===normNombre(a.nombre)))alumnosNuevos++});
 }
 if(hojas.notas){
  const {alumnos}=parseNotas(hojas.notas);
  alumnos.forEach(a=>{if(!(c.alumnos||[]).find(x=>normNombre(x.nombre)===normNombre(a)))alumnosNuevos++});
 }
 return `<div class=card style="margin:0"><b>Preview de fusión</b>
  <div class=muted>Curso: ${esc(c.nombre)}</div>
  <div>Alumnos nuevos: <b>${alumnosNuevos}</b></div>
  <div>Fechas nuevas: <b>${nuevasFechas}</b></div>
  <div class=muted>Se actualizarán circuitos, notas y cierres de los alumnos que coincidan por nombre. No se borra nada.</div>
 </div>`;
}
function parseAsistencia(rows){
 let fr=-1;
 for(let r=0;r<Math.min(rows.length,8);r++){
  const fechas=(rows[r]||[]).filter(x=>esFecha(x)).length;
  if(fechas>=3){fr=r;break}
 }
 if(fr<0)return{fechas:[],alumnos:[]};
 const fechas=[];const colsFecha=[];
 (rows[fr]||[]).forEach((v,i)=>{const f=fechaNorm(v);if(f){fechas.push(f);colsFecha.push(i)}});
 const alumnos=[];
 for(let r=fr+1;r<rows.length;r++){
  const nombre=rows[r][1];
  if(!nombre||/presente|ausente|tarde|promedio|porcentaje|^total$/i.test(String(nombre)))continue;
  const marcas={};
  colsFecha.forEach((ci,k)=>{const v=String(rows[r][ci]||'').trim().toUpperCase();if(['P','A','T'].includes(v))marcas[fechas[k]]=v});
  alumnos.push({nombre:String(nombre).trim(),marcas});
 }
 return{fechas,alumnos};
}
function parseNotas(rows){
 let fNombre=-1;
 for(let r=0;r<rows.length;r++){if(String(rows[r][1]||'').toLowerCase()==='nombre'){fNombre=r;break}}
 if(fNombre<0)return{alumnos:[],circuitosPorAlumno:{},notasPorAlumno:{},cierresPorAlumno:{}};
 const alumnos=[];const circuitosPorAlumno={};const notasPorAlumno={};const cierresPorAlumno={};
 const enc1=rows[fNombre-1]||[];
 const enc1b=rows[fNombre-2]||[];
 const mapa1={};
 // Primera tabla: circuitos 1..37 y evaluaciones 38/41/42; también cierres
 enc1.forEach((v,i)=>{
  const s=String(v||'').trim();
  if(/^\d+(\.0)?$/.test(s)){
   const n=parseInt(s);
   if(n>=1&&n<=37)mapa1[i]={tipo:'circ',nro:n};
   else if(n===38||n===41||n===42||n>=43&&n<=48)mapa1[i]={tipo:'ev',nro:n};
  }
 });
 [enc1,enc1b].forEach(enc=>{
  enc.forEach((v,i)=>{
   const s=String(v||'').trim().toLowerCase();
   const keys=['1er','2do','3ro','4to','nota','dic','feb','f','avance 1er cuatrimentre','avance 2do cuatrimestre'];
   if(keys.includes(s)&&!mapa1[i])mapa1[i]={tipo:'cie',key:s};
  });
 });
 for(let r=fNombre+1;r<rows.length;r++){
  const row=rows[r]||[];
  const nombre=String(row[1]||'').trim();
  if(!nombre||/circuitos|promedio|nombre/i.test(nombre))break;
  const circs=[];const notas={};const cie={};
  Object.entries(mapa1).forEach(([i,m])=>{
   const v=row[i];
   if(m.tipo==='circ'&&String(v||'').toUpperCase()==='X')circs.push(m.nro);
   else if(m.tipo==='ev'&&v!==''&&v!=null)notas['ev'+m.nro]=v;
   else if(m.tipo==='cie'&&v!==''&&v!=null)cie[m.key]=v;
  });
  alumnos.push(nombre);
  circuitosPorAlumno[nombre]=circs;
  notasPorAlumno[nombre]=notas;
  cierresPorAlumno[nombre]=cie;
 }
 // Segunda tabla: buscar "circuitos" en cualquier columna
 let f2=-1;
 for(let r=fNombre+1;r<rows.length;r++){
  const row=rows[r]||[];
  const hasCirc=row.some(x=>String(x||'').toLowerCase()==='circuitos');
  if(hasCirc){f2=r;break}
 }
 if(f2>=0){
  // headers numéricos en la fila f2+1 o f2+2
  let enc2=null;
  for(let k=1;k<=3;k++){
   const cand=rows[f2+k]||[];
   const nums=cand.filter(x=>/^\d+(\.0)?$/.test(String(x||'').trim())).length;
   if(nums>=3){enc2=cand;break}
  }
  if(enc2){
   const mapa2={};
   enc2.forEach((v,i)=>{const s=String(v||'').trim();if(/^\d+(\.0)?$/.test(s)){const n=parseInt(s);if(n>=25&&n<=48)mapa2[i]=n}});
   const startRow=(rows.indexOf(enc2))+1;
   for(let r=startRow;r<rows.length;r++){
    const row=rows[r]||[];
    const nombre=String(row[1]||'').trim();
    if(!nombre||/nombre|leyenda|sin fotocopias/i.test(nombre))continue;
    const idx=alumnos.findIndex(a=>normNombre(a)===normNombre(nombre));
    if(idx<0)continue;
    Object.entries(mapa2).forEach(([i,nro])=>{
     if(String(row[i]||'').toUpperCase()==='X'){
      const n=parseInt(nro);
      if(!circuitosPorAlumno[nombre].includes(n))circuitosPorAlumno[nombre].push(n);
     }
    });
   }
  }
 }
 return{alumnos,circuitosPorAlumno,notasPorAlumno,cierresPorAlumno};
}function aplicarImport(){
 if(!_imp.hojas||(!_imp.hojas.asistencia&&!_imp.hojas.notas)){toast('No hay hojas válidas');return}
 if(!confirm('¿Fusionar los datos del Excel con el curso actual? (Se puede deshacer)'))return;
 pushH();
 const c=C();
 if(_imp.hojas.asistencia){
  const {alumnos}=parseAsistencia(_imp.hojas.asistencia);
  alumnos.forEach(a=>{
   let al=(c.alumnos||[]).find(x=>normNombre(x.nombre)===normNombre(a.nombre));
   if(!al){al={id:'a'+uid(),nombre:a.nombre,alta:td(),baja:null,codigo:randCode()};c.alumnos=c.alumnos||[];c.alumnos.push(al)}

  });
 }
 if(_imp.hojas.notas){

   let al=(c.alumnos||[]).find(x=>normNombre(x.nombre)===normNombre(nombre));

   });
   Object.entries(r.notasPorAlumno[nombre]||{}).forEach(([k,v])=>{

    c.notas=c.notas||{};

   });
   Object.entries(r.cierresPorAlumno[nombre]||{}).forEach(([k,v])=>{
    c.cierres=c.cierres||{};

    c.cierres[al.id][key]=v;
   });

 }
 c.alumnos=(c.alumnos||[]).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));

}

const CODE_GS="/* Mi curso - servidor de datos (Google Apps Script)\n   Guarda SOLO información cifrada. Lo que está acá no se puede leer sin el código de cada familia\n   (o, en el caso de tu copia, sin tu clave). */\nvar TOKEN = '__TOKEN__';   // tu clave de docente: la pone el panel; no la compartas\n\nfunction hoja_(n) {\n  var s = SpreadsheetApp.getActiveSpreadsheet(), h = s.getSheetByName(n);\n  return h || s.insertSheet(n);\n}\nfunction salida_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\nfunction meta_() {\n  var d = hoja_('meta').getDataRange().getValues(), m = {}, i;\n  for (i = 0; i < d.length; i++) { if (d[i][0] !== '') m[d[i][0]] = d[i][1]; }\n  return m;\n}\nfunction setMeta_(obj) {\n  var h = hoja_('meta'), d = h.getDataRange().getValues(), pos = {}, i, k;\n  for (i = 0; i < d.length; i++) { if (d[i][0] !== '') pos[d[i][0]] = i + 1; }\n  for (k in obj) {\n    if (pos[k]) { h.getRange(pos[k], 2).setValue(obj[k]); }\n    else { h.appendRow([k, obj[k]]); pos[k] = h.getLastRow(); }\n  }\n}\n/* Los textos se guardan con una \"x\" adelante para que Sheets no los convierta en números o fórmulas */\nfunction leer_(h) {\n  var d = h.getDataRange().getValues(), out = [], i;\n  for (i = 0; i < d.length; i++) { if (d[i][0] !== '' && d[i][0] !== undefined) out.push(d[i]); }\n  return out;\n}\n\nfunction doGet(e) {\n  var p = (e && e.parameter) || {};\n  try {\n    if (p.a === 'meta') {\n      var m = meta_();\n      return salida_({ ok: true, v: 2, salt: m.salt || '', it: Number(m.it) || 0, gen: m.gen || '' });\n    }\n    if (p.a === 'get') {\n      var k = String(p.k || '');\n      if (!/^[0-9a-f]{24}$/.test(k)) return salida_({ ok: false });\n      var filas = leer_(hoja_('padres')), i;\n      for (i = 0; i < filas.length; i++) {\n        if (filas[i][0] === 'x' + k) {\n          return salida_({ ok: true, i: String(filas[i][1]).slice(1), c: String(filas[i][2]).slice(1) });\n        }\n      }\n      return salida_({ ok: false });\n    }\n    return salida_({ ok: true, servicio: 'Mi curso' });\n  } catch (err) {\n    return salida_({ ok: false, err: String(err) });\n  }\n}\n\nfunction doPost(e) {\n  var lock = LockService.getScriptLock(), tomado = false;\n  try {\n    var b = JSON.parse(e.postData.contents);\n    if (b.t !== TOKEN) return salida_({ ok: false, err: 'clave' });\n    lock.waitLock(20000); tomado = true;\n    var ahora = new Date().toISOString(), i, k, m;\n\n    if (b.a === 'ping') return salida_({ ok: true });\n\n    if (b.a === 'pub') {\n      var h = hoja_('padres'), filas = leer_(h), mapa = {}, items = b.items || {}, keep = {};\n      for (i = 0; i < (b.keep || []).length; i++) keep[b.keep[i]] = 1;\n      for (i = 0; i < filas.length; i++) mapa[String(filas[i][0]).slice(1)] = filas[i];\n      for (k in items) {\n        if (!/^[0-9a-f]{24}$/.test(k)) continue;\n        mapa[k] = ['x' + k, 'x' + items[k].i, 'x' + items[k].c, ahora];\n        keep[k] = 1;\n      }\n      var final = [];\n      for (k in mapa) { if (keep[k]) final.push(mapa[k]); }\n      h.clearContents();\n      if (final.length) h.getRange(1, 1, final.length, 4).setValues(final);\n      setMeta_({ salt: b.salt, it: b.it, gen: ahora });\n      return salida_({ ok: true, n: final.length, gen: ahora });\n    }\n\n    if (b.a === 'save') {                 // copia cifrada de TUS datos\n      m = meta_();\n      if (!b.force && m.estado_ts && b.base !== m.estado_ts) {\n        return salida_({ ok: false, err: 'conflicto', ts: m.estado_ts });\n      }\n      var s = String(b.blob || ''), hh = hoja_('estado'), rows = [];\n      for (i = 0; i < s.length; i += 40000) rows.push(['x' + s.slice(i, i + 40000)]);\n      hh.clearContents();\n      if (rows.length) hh.getRange(1, 1, rows.length, 1).setValues(rows);\n      setMeta_({ estado_ts: ahora });\n      return salida_({ ok: true, ts: ahora });\n    }\n\n    if (b.a === 'state') {\n      m = meta_();\n      var fs = leer_(hoja_('estado')), t = '';\n      for (i = 0; i < fs.length; i++) t += String(fs[i][0]).slice(1);\n      return salida_({ ok: true, blob: t, ts: m.estado_ts || '' });\n    }\n    return salida_({ ok: false, err: 'accion' });\n  } catch (err) {\n    return salida_({ ok: false, err: String(err) });\n  } finally {\n    if (tomado) { try { lock.releaseLock(); } catch (x) {} }\n  }\n}\n";
const PADRES_TPL="<!doctype html>\n<html lang=\"es\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"robots\" content=\"noindex,nofollow\">\n<title>Seguimiento del alumno<\/title>\n<style>\n:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#e1e5ea;--ac:#2a62d9;--ok:#1f9d55;--no:#d64545;--wa:#d9890f;color-scheme:light}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#14181e;--card:#1d232c;--tx:#e8ecf1;--mu:#93a0b1;--bd:#2c3542;--ac:#6b95f0;--ok:#43c27a;--no:#f07070;--wa:#e9a73e;color-scheme:dark}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}\n#app{max-width:720px;margin:0 auto;padding:14px}\nh1{font-size:21px;margin:0 0 2px}h2{font-size:16px;margin:0 0 8px}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}\n.muted{color:var(--mu);font-size:14px}\n.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}\ninput{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 13px;text-transform:uppercase;letter-spacing:2px;font-weight:700;font-family:ui-monospace,Consolas,monospace}\nbutton{font:inherit;cursor:pointer;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700}\nbutton.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.6;cursor:wait}\n.big{font-size:30px;font-weight:700;line-height:1.1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;text-align:center;margin-top:6px}\n.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}\n.ok{color:var(--ok);font-weight:600}.no{color:var(--no);font-weight:600}\n.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}\n.pill{display:inline-block;padding:3px 10px;border-radius:10px;font-size:13px;background:var(--bd);color:var(--mu);margin:2px}\n.pill.no{background:rgba(214,69,69,.15);color:var(--no)}.pill.ok{background:rgba(31,157,85,.16);color:var(--ok)}.pill.wa{background:rgba(217,137,15,.2);color:var(--wa)}\n.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}\n.chip{display:flex;flex-direction:column;align-items:center;min-width:40px;padding:3px 4px;border-radius:7px;background:var(--bd);color:var(--mu);font-size:12px}\n.chip b{font-size:14px}.chip i{font-style:normal;font-size:10px}\n.chip.P{background:var(--ok);color:#fff}.chip.A{background:var(--no);color:#fff}.chip.T{background:var(--wa);color:#fff}\n.alert{background:rgba(214,69,69,.12);border:1px solid var(--no);color:var(--no);border-radius:10px;padding:8px 10px;margin-top:10px;font-weight:600;font-size:14px}\n.note{font-size:13px;color:var(--mu);margin:6px 0 0}\n#msg{min-height:20px;font-size:14px;color:var(--mu);margin:8px 0 0}\nfooter{text-align:center;margin:26px 0 10px}\n@media print{button,.noprint{display:none!important}body{background:#fff}.card{break-inside:avoid}}\n<\/style><\/head><body>\n<div id=\"app\"><\/div>\n<script>\nconst $=s=>document.querySelector(s);\nconst esc=s=>String(s==null?'':s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));\nconst fd=d=>d?d.slice(8)+'/'+d.slice(5,7):'';\nconst fdl=d=>d?d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'';\nconst E=new TextEncoder(),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));\nconst hex=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');\n/* ---- v2: una sola derivación lenta (PBKDF2) por código; el índice y la clave salen de ella ---- */\nasync function kdf(code,salt,it){const b=await crypto.subtle.importKey('raw',E.encode(code),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},b,256))}\nasync function h2(k,tag){const t=E.encode(tag),m=new Uint8Array(k.length+t.length);m.set(k);m.set(t,k.length);return new Uint8Array(await crypto.subtle.digest('SHA-256',m))}\nasync function idxOf(k){return hex((await h2(k,'idx')).slice(0,12))}\nasync function dec2(k,e){const ek=await crypto.subtle.importKey('raw',await h2(k,'enc'),'AES-GCM',false,['decrypt']);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(e.i)},ek,ub(e.c))))}\n/* ---- v1: formato anterior (se sigue leyendo hasta que vuelvas a publicar) ---- */\nasync function sha1(s){return hex(new Uint8Array(await crypto.subtle.digest('SHA-256',E.encode(s)))).slice(0,20)}\nasync function dec1(code,e){const b=await crypto.subtle.importKey('raw',E.encode(code),'PBKDF2',false,['deriveKey']);const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(e.s),iterations:100000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['decrypt']);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(e.i)},k,ub(e.c))))}\n\n/* Si este archivo lo descargaste desde el panel (☁️ Nube), la dirección del servidor ya viene puesta */\nconst API_URL='__API_URL__';const API=API_URL.indexOf('__')===0?'':API_URL;\nlet META=null,SNAP=null,SINRED=false;\nasync function cargar(){\n if(API){try{const r=await fetch(API+'?a=meta',{cache:'no-store'}),j=await r.json();META=(j&&j.ok&&j.salt)?j:null;SINRED=false}catch(e){META=null;SINRED=true}return}\n try{const r=await fetch('datos-padres.json',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();META=j;SNAP=j.snap||j}catch(e){META=null;SNAP=null}\n}\nfunction inicio(){\n const gen=META&&(META.generado||META.gen);\n let sv='';try{sv=localStorage.getItem('pcod')||''}catch(e){}\n $('#app').innerHTML=`<h1>🎓 Seguimiento del alumno<\/h1>\n <p class=muted>Ingresá el código que te entregó el docente.<\/p>\n <div class=card><div class=row>\n  <input id=cd value=\"${esc(sv)}\" placeholder=\"XXXX-XXXX\" maxlength=9 autocomplete=off autocapitalize=characters spellcheck=false style=\"flex:1;min-width:150px\">\n  <button id=vb onclick=\"ver()\">Ver<\/button><\/div><p id=msg role=status><\/p><\/div>\n <div id=rep><\/div>\n <footer class=muted>${gen?'Datos actualizados el '+new Date(gen).toLocaleString('es-AR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}):''}<br>Si no tenés el código, pedíselo al docente del curso.<\/footer>`;\n $('#cd').addEventListener('keydown',e=>{if(e.key==='Enter')ver()});\n if(sv&&META)ver();\n}\nasync function ver(){\n const code=$('#cd').value.toUpperCase().replace(/[^A-Z0-9]/g,''),m=$('#msg'),b=$('#vb');\n if(!code){m.textContent='Escribí el código.';return}\n if(code.length!==8){m.textContent='El código tiene 8 letras y números (XXXX-XXXX).';return}\n if(!META&&API){m.textContent='Conectando…';await cargar()}\n if(!META){m.textContent=SINRED?'No se pudo conectar. Revisá tu conexión e intentá de nuevo.':'Todavía no hay información publicada.';return}\n b.disabled=true;m.textContent='Verificando…';\n try{\n  let p=null;\n  if(API){const k=await kdf(code,ub(META.salt),META.it),r=await fetch(API+'?a=get&k='+await idxOf(k),{cache:'no-store'}),j=await r.json();if(j&&j.ok)p=await dec2(k,{i:j.i,c:j.c})}\n  else if(META.v===2){const k=await kdf(code,ub(META.salt),META.it),e=SNAP[await idxOf(k)];if(e)p=await dec2(k,e)}\n  else{const e=SNAP[await sha1('i:'+code)];if(e)p=await dec1(code,e)}\n  if(!p){m.textContent='Código no encontrado. Revisalo e intentá de nuevo.';$('#rep').innerHTML='';try{localStorage.removeItem('pcod')}catch(x){}return}\n  m.textContent='';try{localStorage.setItem('pcod',code)}catch(x){}\n  mostrar(p);\n }catch(x){m.textContent=(x&&x.name==='TypeError')?'No se pudo conectar. Revisá tu conexión e intentá de nuevo.':'No se pudo abrir con ese código.';$('#rep').innerHTML=''}\n finally{b.disabled=false}\n}\nconst isN=v=>/^\\d+([.,]\\d+)?$/.test(String(v).trim()),nv=v=>parseFloat(String(v).replace(',','.'));\nfunction nota(v){if(isN(v))return`<b class=\"${nv(v)<6?'no':''}\">${esc(v)}<\/b>`;const u=String(v).toUpperCase();\n if(u==='TEA')return'<span class=\"pill ok\">TEA<\/span>';if(u==='TEP')return'<span class=\"pill wa\">TEP<\/span>';\n if(u==='A')return'<span class=muted>Ausente<\/span>';if(u==='X')return'<span class=ok>✔<\/span>';return`<b>${esc(v)}<\/b>`}\nfunction recLegacy(p){const g={};(p.gr||[]).forEach(x=>{const t=String(x[0]).split(' · ')[0];(g[t]=g[t]||[]).push(x[1])});\n return Object.keys(g).filter(t=>{const n=g[t].filter(isN).map(nv);return n.length&&Math.max(...n)<6})}\nfunction mostrar(p){\n const tot=p.p+p.a+p.t,pc=tot?Math.round((p.p+p.t)/tot*100):null;\n const circH=(p.circ||[]).filter(x=>x[1]).length,circT=(p.circ||[]).length,circP=circT?Math.round(circH/circT*100):0;\n const rec=Array.isArray(p.rec)?p.rec:recLegacy(p);\n const cie=Object.entries(p.cie||{}).filter(([k,v])=>v!==''&&v!=null&&v!=='-');\n let h=`<h1>${esc(p.n)}<\/h1><p class=muted style=\"margin-bottom:10px\">${esc(p.c)}${p.m?' · '+esc(p.m):''} · actualizado ${fdl(p.u)}<\/p>`;\n h+=`<div class=card><h2>Asistencia<\/h2>${pc===null?'<p class=muted>Todavía no hay clases registradas.<\/p>':`<div class=grid>\n  <div><div class=\"big ${pc<75?'no':pc<85?'':'ok'}\" style=\"${pc>=75&&pc<85?'color:var(--wa)':''}\">${pc}%<\/div><div class=muted>asistencia<\/div><\/div>\n  <div><div class=big>${p.p}<\/div><div class=muted>presentes<\/div><\/div>\n  <div><div class=\"big ${p.a?'no':''}\">${p.a}<\/div><div class=muted>ausentes<\/div><\/div>\n  <div><div class=big>${p.t}<\/div><div class=muted>tarde<\/div><\/div><\/div>\n  ${pc<75?'<div class=alert>⚠ La asistencia está por debajo del 75 %. Conviene hablar con el docente.<\/div>':''}\n  ${p.last.length?`<div class=chips>${p.last.slice().reverse().map(x=>`<span class=\"chip ${x[1]}\"><b>${{P:'P',A:'A',T:'T'}[x[1]]||''}<\/b><i>${fd(x[0])}<\/i><\/span>`).join('')}<\/div><p class=note>Últimas clases (P presente · A ausente · T tarde)<\/p>`:''}`}<\/div>`;\n if((p.obs||[]).length)h+=`<div class=card><h2>Observaciones del docente<\/h2>${p.obs.map(o=>`<div class=item><span>${esc(o[1])}<\/span><span class=muted>${fd(o[0])}<\/span><\/div>`).join('')}<\/div>`;\n if(circT)h+=`<div class=card><h2>Circuitos<\/h2><p>Realizados: <b>${circH}<\/b> de <b>${circT}<\/b><\/p><div class=bar><i style=\"width:${circP}%\"><\/i><\/div>${p.circ.map(x=>`<div class=item><span>${esc(x[0])}<\/span><span class=\"${x[1]?'ok':'muted'}\">${x[1]?'✔ Hecho':'Pendiente'}<\/span><\/div>`).join('')}<\/div>`;\n h+=`<div class=card><h2>Notas<\/h2>${(p.gr||[]).length?p.gr.map(x=>`<div class=item><span>${esc(x[0])}<\/span>${nota(x[1])}<\/div>`).join(''):'<p class=muted>Sin notas cargadas aún.<\/p>'}<\/div>`;\n if(cie.length)h+=`<div class=card><h2>Cierres<\/h2>${cie.map(([k,v])=>`<div class=item><span>${esc(k)}<\/span>${nota(v)}<\/div>`).join('')}${p.fin!=null?`<p class=note>Promedio de las notas numéricas de los cierres: <b>${esc(p.fin)}<\/b><\/p>`:''}<\/div>`;\n if(rec.length)h+=`<div class=card><h2>Temas a recuperar<\/h2><p class=muted>Temas ya evaluados en el curso donde la mejor nota todavía no llega a 6.<\/p>${rec.map(t=>`<span class=\"pill no\">${esc(t)}<\/span>`).join('')}<\/div>`;\n h+=`<div class=\"card noprint\" style=\"text-align:center\"><div class=row style=\"justify-content:center\"><button class=ghost onclick=\"print()\">Imprimir<\/button><button class=ghost onclick=\"salir()\">Consultar otro código<\/button><\/div><\/div>`;\n $('#rep').innerHTML=h;\n}\nfunction salir(){try{localStorage.removeItem('pcod')}catch(e){}inicio()}\n(async()=>{await cargar();inicio()})();\n<\/script><\/body><\/html>\n";
