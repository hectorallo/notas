<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi curso</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#e1e5ea;--ac:#2a62d9;--ok:#1f9d55;--no:#d64545;--wa:#d9890f;--ted:#8e44ad;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181e;--card:#1d232c;--tx:#e8ecf1;--mu:#93a0b1;--bd:#2c3542;--ac:#6b95f0;--ok:#43c27a;--no:#f07070;--wa:#e9a73e;--ted:#b07bd1;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1200px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:0}h2{font-size:16px;margin:14px 0 8px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:8px 11px}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}
button.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.danger{background:var(--no)}
button:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.tabs button{background:var(--card);color:var(--mu);border:1px solid var(--bd);white-space:nowrap;font-weight:500}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px;margin-bottom:9px}
.muted{color:var(--mu);font-size:13px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 7px;border-bottom:1px solid var(--bd);text-align:center;font-size:13px}
th{font-size:12px;font-weight:600;vertical-align:bottom;background:var(--card);position:sticky;top:0;z-index:1}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:2;min-width:160px;font-weight:500}
.cell{width:28px;min-width:28px;height:26px;border:0;background:transparent;text-align:center;font-weight:600;cursor:pointer;border-radius:5px;padding:0;font-size:12px}
.cell.P{background:var(--ok);color:#fff}.cell.A{background:var(--no);color:#fff}.cell.T{background:var(--wa);color:#fff}
.cell.X{background:var(--ok);color:#fff}.cell.O{background:var(--wa);color:#fff}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;font-size:12px;background:var(--bd);color:var(--mu)}
.chip.ok{background:var(--ok);color:#fff}.chip.no{background:var(--no);color:#fff}.chip.wa{background:var(--wa);color:#fff}
.rot{writing-mode:vertical-rl;transform:rotate(180deg);max-height:140px;margin:0 auto;font-weight:500;font-size:11px}
.num{width:44px;min-width:44px;border:1px solid transparent;background:transparent;text-align:center;font-weight:600;padding:4px 2px;border-radius:5px;font-size:12px;transition:background .15s,color .15s}
.num:focus{outline:2px solid var(--ac);background:var(--card)}
.num.okk{color:var(--ok);background:rgba(31,157,85,.16)}
.num.bad{color:var(--no);background:rgba(214,69,69,.16)}
.num.tea{color:var(--ok);background:rgba(31,157,85,.22);font-weight:700}
.num.tep{color:var(--wa);background:rgba(217,137,15,.22);font-weight:700}
.num.ted{color:var(--ted);background:rgba(142,68,173,.18);font-weight:700}
.num.aus{color:var(--mu);background:rgba(107,118,134,.12);font-style:italic}
.fecha{width:100%;max-width:110px;font-size:10px;padding:2px 4px;border-radius:5px;border:1px solid var(--bd);background:transparent;color:var(--mu)}
.fot{display:inline-block;padding:2px 6px;border-radius:7px;background:rgba(217,137,15,.18);color:var(--wa);font-size:11px;font-weight:700;cursor:pointer;min-width:34px;user-select:none}
.fot:hover{background:rgba(217,137,15,.32)}
.celdaNota{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 12px;font-size:12px;margin-top:6px}
.legend div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp{background:var(--bd);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:9px;background:var(--bd);font-size:12px;margin:2px}
.pill.ok{background:rgba(31,157,85,.18);color:var(--ok)}.pill.no{background:rgba(214,69,69,.15);color:var(--no)}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;display:none;font-size:13px;z-index:99}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:100}
#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:14px;padding:14px;max-width:720px;width:100%;max-height:88vh;overflow:auto;position:relative;padding-top:36px}
#modal .x{position:absolute;top:8px;right:10px;background:transparent;border:0;color:var(--mu);font-size:22px;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:8px}
#modal .x:hover{background:var(--bd);color:var(--tx)}
#modal textarea{width:100%;min-height:140px;font-family:ui-monospace,monospace;font-size:12px}
.mini{font-size:12px;padding:4px 8px}
.hero{text-align:center;padding:30px 14px}
.hero .big{font-size:22px;font-weight:700;margin-bottom:8px}
.hero .btn-file{display:inline-block;background:var(--ac);color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;cursor:pointer;margin-top:10px}
.hero input[type=file]{display:none}
.pl-btn{width:40px;height:36px;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:7px;font-weight:700;font-size:14px;cursor:pointer;padding:0}
.pl-btn.P{background:var(--ok);color:#fff;border-color:var(--ok)}
.pl-btn.A{background:var(--no);color:#fff;border-color:var(--no)}
.pl-btn.T{background:var(--wa);color:#fff;border-color:var(--wa)}
#menuBtn{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
#menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);min-width:260px;padding:6px;z-index:50;display:none}
#menu.on{display:block}
#menu .sec{padding:6px 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-top:4px}
#menu button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:transparent;color:var(--tx);border:0;border-radius:8px;padding:9px 10px;font-weight:500;cursor:pointer}
#menu button:hover{background:var(--bd)}
#menu .sep{height:1px;background:var(--bd);margin:4px 0}
header .menuWrap{position:relative}
@media print{.tabs,header,button,.noprint{display:none!important}.wrap{overflow:visible}}
</style></head><body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="box"><button class="x" onclick="closeModal()" title="Cerrar">✕</button><div id="modalBox"></div></div></div>
<script>
console.log('Mi curso v6.4 (fecha por nota + fotocopias)');
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const KEY='micurso-v6';
const uid=()=>Math.random().toString(36).slice(2,9);
const td=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=d=>d?d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4).slice(2):'';
const fc=c=>c?c.slice(0,4)+'-'+c.slice(4):'';
let D=null,cur=0,tab='asist',edit=false,timer;
let HIST=[];
const C=()=>D.cursos[cur];
const catArr=()=>Object.values(D.circuitos||{}).sort((a,b)=>a.nro-b.nro);
const APROB=7;
const parseNum=v=>{if(v==null||v==='')return null;const s=String(v).replace(',','.').trim();if(/^-?\d+(\.\d+)?$/.test(s))return parseFloat(s);return null};
const notaDe=v=>{if(v&&typeof v==='object')return v.v;return v};
const fechaDe=v=>{if(v&&typeof v==='object')return v.f||'';return''};
const gcls=v=>{
 const n=parseNum(notaDe(v));
 if(n!=null)return n<APROB?'bad':'okk';
 const u=String(notaDe(v)||'').toUpperCase();
 return {TEA:'tea',TEP:'tep',TED:'ted',A:'aus',X:'aus','-':'aus','XX':'aus','NE':'aus'}[u]||'';
};

function statsAsist(c,s){try{let p=0,a=0,t=0;const asis=c.asistencia||{};for(const f in asis){const v=asis[f][s.id];if(!v)continue;if(v==='P')p++;else if(v==='A')a++;else t++}const n=p+a+t;return{n,p,a,t,pc:n?Math.round((p+t)/n*100):null}}catch(e){return{n:0,p:0,a:0,t:0,pc:null}}}
const usaCirc=c=>c.usaCirc!==undefined?!!c.usaCirc:Object.keys(c.circuitosHechos||{}).length>0;
function circHechos(c,id){return (c.circuitosHechos||{})[id]||[]}
function temasDe(c){try{return [...new Set((c.evaluaciones||[]).map(e=>e.tema))]}catch(e){return[]}}
function mejorTema(c,id,tema){try{const evs=(c.evaluaciones||[]).filter(e=>e.tema===tema);let best=null;evs.forEach(e=>{const n=parseNum(notaDe(((c.notas||{})[id]||{})[e.id]));if(n!=null&&(best==null||n>best))best=n});return best}catch(e){return null}}
function ultimaInstanciaTema(c,id,tema){try{const evs=(c.evaluaciones||[]).filter(e=>e.tema===tema);let ult=null;evs.forEach(e=>{const v=notaDe(((c.notas||{})[id]||{})[e.id]);if(v!=null&&v!=='')ult=v});return ult}catch(e){return null}}
function temaAprobado(c,id,tema){
 const evs=(c.evaluaciones||[]).filter(e=>e.tema===tema);
 let ult=null,best=null,hayTEP=false,hayNumBaja=false;
 evs.forEach(e=>{const v=notaDe(((c.notas||{})[id]||{})[e.id]);if(v==null||v==='')return;ult=v;
  const n=parseNum(v);
  if(n!=null){if(best==null||n>best)best=n;if(n<APROB)hayNumBaja=true}
  else{const u=String(v).toUpperCase();if(u==='TEP')hayTEP=true}
 });
 if(ult==null)return false;
 if(String(ult).toUpperCase()==='TEA')return true;
 if(hayTEP||hayNumBaja)return false;
 if(best!=null&&best>=APROB)return true;
 return false;
}
function temasPend(c,id){return temasEvaluados(c).filter(t=>!temaAprobado(c,id,t))}

function matSel(c){if(!c.materias||!c.materias.length)return null;const id=c._matSel||c.materias[0].id;return c.materias.find(x=>x.id===id)||c.materias[0]}
function temasDeMateria(m){try{return [...new Set((m.evaluaciones||[]).map(e=>e.tema))]}catch(e){return[]}}
function mejorTemaMateria(c,id,m,tema){try{const evs=(m.evaluaciones||[]).filter(e=>e.tema===tema);let best=null;evs.forEach(e=>{const n=parseNum(notaDe(((c.notas||{})[id]||{})[e.id]));if(n!=null&&(best==null||n>best))best=n});return best}catch(e){return null}}
function temaAprobadoMateria(c,id,m,tema){
 const evs=(m.evaluaciones||[]).filter(e=>e.tema===tema);
 let ult=null,best=null,hayTEP=false,hayNumBaja=false;
 evs.forEach(e=>{const v=notaDe(((c.notas||{})[id]||{})[e.id]);if(v==null||v==='')return;ult=v;
  const n=parseNum(v);
  if(n!=null){if(best==null||n>best)best=n;if(n<APROB)hayNumBaja=true}
  else{const u=String(v).toUpperCase();if(u==='TEP')hayTEP=true}
 });
 if(ult==null)return false;
 if(String(ult).toUpperCase()==='TEA')return true;
 if(hayTEP||hayNumBaja)return false;
 if(best!=null&&best>=APROB)return true;
 return false;
}
function temasPendMateria(c,id,m){return temasDeMateria(m).filter(t=>!temaAprobadoMateria(c,id,m,t))}

function cierreFinal(c,id){
 try{
  const cc=(c&&c.cierres&&c.cierres[id])||{};
  const nums=[];let bajo=false,tep=false,tea=false;
  ['1er','2do','3ro','4to'].forEach(k=>{const v=cc[k];if(v==null||v==='')return;const n=parseNum(v);if(n!=null){nums.push(n);if(n<APROB)bajo=true}else{const u=String(v).toUpperCase();if(u==='TEA')tea=true;if(u==='TEP')tep=true}});
  const prom=nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:null;
  let estado='';
  if(nums.length===0&&!tea&&!tep)estado='Sin datos';
  else if(bajo||tep)estado='A recuperar';
  else if(prom!=null&&prom<APROB)estado='A recuperar';
  else if(prom!=null||tea)estado='Aprobado';
  return{prom:prom!=null?Math.round(prom*10)/10:null,estado};
 }catch(e){return{prom:null,estado:'Sin datos'}}
}
function cierreFinalMateria(c,id,m){
 try{
  const cc=(c.cierres||{})[id]||{};
  const nums=[];let bajo=false,tep=false,tea=false;
  ['1er','2do','3ro','4to'].forEach(k=>{const v=cc[m.id+'_'+k];if(v==null||v==='')return;const n=parseNum(v);if(n!=null){nums.push(n);if(n<APROB)bajo=true}else{const u=String(v).toUpperCase();if(u==='TEA')tea=true;if(u==='TEP')tep=true}});
  const prom=nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:null;
  let estado='';
  if(nums.length===0&&!tea&&!tep)estado='Sin datos';
  else if(bajo||tep)estado='A recuperar';
  else if(prom!=null&&prom<APROB)estado='A recuperar';
  else if(prom!=null||tea)estado='Aprobado';
  return{prom:prom!=null?Math.round(prom*10)/10:null,estado};
 }catch(e){return{prom:null,estado:'Sin datos'}}
}
const chipE=e=>e==='Aprobado'
 ?'<span class="chip ok" style="font-size:13px;padding:3px 10px">Aprobado</span>'
 : e==='A recuperar'
  ?'<span class="chip no" style="font-size:13px;padding:3px 10px">A recuperar</span>'
  :'<span class="chip" style="font-size:13px;padding:3px 10px">Sin datos</span>';

function tipoTxt(c,e){const t=String(e.tipo==null?'':e.tipo).trim();if(!t||t==='Original')return'';
 if(/^\d+(\.0)?$/.test(t)){const g=(c.evaluaciones||[]).filter(x=>x.tema===e.tema),i=g.indexOf(e);return['Evaluación','Recuperatorio','Recup. final'][i]||('Instancia '+(i+1))}return t}
const evLabel=(c,e)=>e.tema+(tipoTxt(c,e)?' · '+tipoTxt(c,e):'');
function temasEvaluados(c){return temasDe(c).filter(t=>(c.alumnos||[]).some(s=>mejorTema(c,s.id,t)!=null||ultimaInstanciaTema(c,s.id,t)!=null))}

function bannerBackup(){let t=null;try{t=localStorage.getItem('micurso-backup')}catch(e){}
 const dias=t?Math.floor((Date.now()-new Date(t))/864e5):null;if(dias!==null&&dias<7)return'';
 return`<div class=card style="border-color:var(--wa);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span>💾 ${dias===null?'Todavía no descargaste ninguna copia de seguridad.':'Hace '+dias+' días que no descargás una copia de seguridad.'} Tus datos viven solo en este navegador.</span><button class=mini onclick="expJSON()">Descargar copia ahora</button></div>`}

function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);const old=localStorage.getItem('micurso-v5');if(old)return JSON.parse(old)}catch(e){}return null}
function save(){clearTimeout(timer);timer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('No se pudo guardar')}programarSync()},250)}
function pushH(){HIST.push(JSON.stringify(D)+'§'+cur);if(HIST.length>40)HIST.shift()}
function undo(){if(!HIST.length){toast('Nada para deshacer');return}const s=HIST.pop(),i=s.lastIndexOf('§');D=JSON.parse(s.slice(0,i));cur=parseInt(s.slice(i+1))||0;if(cur>=D.cursos.length)cur=0;save();render();toast('Deshecho')}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}
function setTab(k){tab=k;render()}
window.setTab=setTab;
function toggleEdit(){edit=!edit;clearTimeout(window._e);if(edit)window._e=setTimeout(()=>{edit=false;render()},10*60000);render();toast(edit?'✏️ Edición activada':'🔒 Modo ver')}
window.toggleEdit=toggleEdit;
function abrirMenu(e){if(e){e.preventDefault();e.stopPropagation()}const m=$('#menu');if(m)m.classList.toggle('on')}
window.abrirMenu=abrirMenu;
function closeMenu(){const m=$('#menu');if(m)m.classList.remove('on')}
window.closeMenu=closeMenu;
document.addEventListener('click',e=>{const m=$('#menu');if(!m||!m.classList.contains('on'))return;const w=m.closest('.menuWrap');if(w&&!w.contains(e.target))m.classList.remove('on')});

function render(){
 const app=$('#app');
 try{
  if(!D){app.innerHTML=`<div class=hero><div class=big>🎓 Mi curso</div><p class=muted>Cargá el archivo de datos para empezar.</p><label class=btn-file>📂 Cargar datos-2026.json<input type=file accept=".json" onchange="loadJSON(this)"></label><p class=muted style="margin-top:20px">o <a href="#" onclick="blank();return false">empezar vacío</a></p><p class=muted>¿Ya usás la nube? <a href="#" onclick="openNube();return false">☁️ Conectar y restaurar mis datos</a></p></div>`;return}
  const c=C();
  if(!c){app.innerHTML='<div class=card><b>No hay cursos.</b><p class=muted>Creá uno nuevo o recuperá el último con Deshacer.</p><div class=row><button onclick="nuevoAnio()">➕ Crear curso</button><button class=ghost onclick="undo()">↶ Deshacer</button><button class=ghost onclick="openImportJSON()">📂 Cargar JSON</button></div></div>';return}
  let h=`<header><h1>🎓 Mi curso</h1><div class=row>
   ${D.cursos.length?`<select onchange="cur=+this.value;render()">${D.cursos.map((x,i)=>`<option value=${i} ${i==cur?'selected':''}>${esc(x.nombre)} (${x.anio})</option>`).join('')}</select>`:''}
   <button class=ghost onclick="toggleEdit()">${edit?'✏️ Editando':'🔒 Ver'}</button>
   <button class=ghost onclick="openNube()" title="Nube">${nubeOK()?'☁️ '+(nubeEstado||'Conectada'):'☁️ Nube'}</button>
   <div class=menuWrap style="position:relative">
    <button id=menuBtn onclick="abrirMenu(event)" title="Menú">⚙️</button>
    <div id=menu>
     <div class=sec>Datos</div>
     <button onclick="closeMenu();expJSON()">⬇ Exportar JSON</button>
     <button onclick="closeMenu();openImportXlsx()">📥 Importar Excel</button>
     <button onclick="closeMenu();openImportJSON()">📂 Cargar JSON</button>
     <button onclick="closeMenu();nuevoAnio()">📅 Nuevo curso / año</button>
     <div class=sep></div>
     <div class=sec>Publicación</div>
     <button onclick="closeMenu();publicarPadres()">📤 Publicar para padres</button>
    </div>
   </div>
   <button class=ghost onclick="undo()" title="Deshacer último cambio">↶</button>
  </div></header>`;
  h+=bannerBackup();
  h+=`<div class=tabs>${[['asist','Asistencia'],['circ','Circuitos'],['eval','Evaluaciones'],['cie','Cierres'],['obs','Observaciones'],['alum','Alumnos'],['rep','Reportes'],['pad','Padres']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div>`;
  h+=`<div class=muted style="margin-bottom:6px">${esc(c.materia||'')}${c.docente?' · '+esc(c.docente):''} · ${(c.alumnos||[]).length} alumnos · ${c.anio||''}${c.materias&&c.materias.length?' · '+c.materias.map(m=>esc(m.nombre)).join(' / '):''}</div>`;
  let fn=null;
  if(tab==='asist')fn=vAsist;else if(tab==='circ')fn=vCirc;else if(tab==='eval')fn=vEval;else if(tab==='cie')fn=vCie;else if(tab==='alum')fn=vAlum;else if(tab==='rep')fn=vRep;else if(tab==='pad')fn=vPad;else if(tab==='obs')fn=vObs;
  if(!fn){tab='asist';fn=vAsist;}
  let body='';
  try{body=fn(c)}catch(e){console.error('Error en pestaña '+tab,e);body='<div class=card style="border-color:var(--no)"><b style="color:var(--no)">Error en esta pestaña</b><div class=muted>'+esc(e&&e.message||String(e))+'</div></div>'}
  h+=body;app.innerHTML=h;
 }catch(e){console.error('Error general de render',e);app.innerHTML='<div class=card style="border-color:var(--no)"><b style="color:var(--no)">Error al dibujar la app</b><div class=muted>'+esc(e&&e.message||String(e))+'</div></div>'}
}

// Asistencia
let asisFiltro='';
function vAsist(c){
 const fechas=Object.keys(c.asistencia||{}).sort();
 const total=(c.alumnos||[]).length;

function obsAbrir(id){const c=C(),s=(c.alumnos||[]).find(x=>x.id===id);if(!s)return;const l=obsDe(c,id);$('#modalBox').innerHTML=`<h2>${esc(s.nombre)}</h2>`+(edit?`<div class=row style="margin:6px 0">${presetsObs().map((p,i)=>`<button class="ghost mini" onclick="obsPreset('${id}',${i})">${esc(p)}</button>`).join('')}</div><div class=row style="margin:6px 0"><input id=obT placeholder="Otra nota…" style="flex:1;min-width:180px"><input id=obF type=date value="${td()}"></div><div class=row style="margin:6px 0"><label><input type=checkbox id=obV checked> Visible para los padres</label><button onclick="obsGuardar('${id}')">Agregar</button></div>`:'<p class=muted>Activá ✏️ para agregar notas.</p>')+`<h2 style="margin-top:14px">Historial (${l.length})</h2>`+(l.length?l.map(o=>`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)"><span><span class=muted>${fd(o.f)}</span> · ${esc(o.t)} <span class="chip ${o.v===false?'':'ok'}">${o.v===false?'privada':'visible'}</span></span>${edit?`<span class=row style="flex-wrap:nowrap"><button class="ghost mini" onclick="obsVis('${id}','${o.id}')">${o.v===false?'Mostrar':'Ocultar'}</button><button class="ghost mini" onclick="obsDel('${id}','${o.id}')">✕</button></span>`:''}</div>`).join(''):'<p class=muted>Sin observaciones.</p>');$('#modal').classList.add('on')}

// Nube
const NK='micurso-nube',KC='micurso-kc',PH='micurso-pubhash';
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let NB=lsGet(NK,null),nubeEstado='',nubeTimer=null,nubeBusy=false,_ek=null;
const nubeOK=()=>!!(NB&&NB.url&&NB.token);
const pubUb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pubOpen(k,e){const ek=await crypto.subtle.importKey('raw',await pubH(k,'enc'),'AES-GCM',false,['decrypt']);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:pubUb(e.i)},ek,pubUb(e.c))))}
async function apiPost(a,body){const r=await fetch(NB.url,{method:'POST',body:JSON.stringify(Object.assign({t:NB.token,a},body||{}))});try{return await r.json()}catch(e){throw new Error('el servidor no respondió como se esperaba')}}
async function hashStr(s){return pubHex(new Uint8Array(await crypto.subtle.digest('SHA-256',PUB_E.encode(s)))).slice(0,16)}
async function nubeKey(code){let kc=lsGet(KC,{});if(kc.salt!==NB.salt||kc.it!==NB.it)kc={salt:NB.salt,it:NB.it,k:{}};if(!kc.k[code]){kc.k[code]=pubB64(await pubKdf(code,pubUb(NB.salt),NB.it));lsSet(KC,kc)}return pubUb(kc.k[code])}
async function estadoKey(){if(!_ek)_ek=await pubKdf(NB.token,PUB_E.encode('micurso-estado'),300000);return _ek}
function programarSync(){if(!nubeOK()||!NB.auto||!D)return;nubeEstado='Pendiente…';clearTimeout(nubeTimer);nubeTimer=setTimeout(()=>publicarNube(false),6000)}
async function nubeGuardarEstado(force){const k=await estadoKey(),blob=JSON.stringify(await pubSeal(k,D)),r=await apiPost('save',{blob,base:NB.lastState||'',force:!!force});if(r.ok){NB.lastState=r.ts;lsSet(NK,NB);return 'ok'}if(r.err==='conflicto')return 'conflicto';throw new Error(r.err==='clave'?'la clave no coincide':(r.err||'no se pudo guardar'))}
async function publicarNube(modo){if(!nubeOK()||!D||nubeBusy)return;nubeBusy=true;nubeEstado='Sincronizando…';try{if(await nubeGuardarEstado(false)==='conflicto'){nubeEstado='⚠ Conflicto';toast('La nube tiene datos más nuevos de otro dispositivo. Abrí ☁️ y elegí Restaurar o Sobrescribir.');return}const lista=[];D.cursos.forEach(c=>(c.alumnos||[]).forEach(s=>{if(s.codigo&&!s.baja)lista.push([c,s])}));const ph=lsGet(PH,{}),nuevos={},items={},keep=[];let n=0;for(const[c,s]of lista){const kc=lsGet(KC,{});if(!(kc.salt===NB.salt&&kc.it===NB.it&&kc.k&&kc.k[s.codigo])){nubeEstado='Preparando '+(++n)+'…'}const k=await nubeKey(s.codigo),idx=await pubIdx(k),pl=pubPayload(c,s),h=await hashStr(JSON.stringify(Object.assign({},pl,{u:''})));keep.push(idx);nuevos[idx]=h;if(modo==='todo'||ph[idx]!==h)items[idx]=await pubSeal(k,pl)}const r=await apiPost('pub',{salt:NB.salt,it:NB.it,items,keep});if(!r.ok)throw new Error(r.err==='clave'?'la clave no coincide':(r.err||'respuesta inválida'));lsSet(PH,nuevos);nubeEstado='Sincronizado '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});if(modo)toast('Listo: '+Object.keys(items).length+' alumnos actualizados en la nube')}catch(e){console.error(e);nubeEstado='Error de conexión';if(modo)toast('No se pudo sincronizar: '+(e&&e.message||e))}finally{nubeBusy=false}}
async function nubeRestaurar(){if(!nubeOK()){toast('Primero guardá la conexión');return}try{const r=await apiPost('state');if(!r.ok||!r.blob){toast('No hay una copia guardada en la nube');return}let o;try{o=await pubOpen(await estadoKey(),JSON.parse(r.blob))}catch(e){throw new Error('la clave no corresponde a esta copia')}if(!o||!Array.isArray(o.cursos))throw new Error('copia inválida');if(!confirm('¿Reemplazar los datos de ESTE dispositivo por la copia de la nube ('+new Date(r.ts).toLocaleString('es-AR')+')?'))return;if(D)pushH();D=o;cur=0;NB.lastState=r.ts;lsSet(NK,NB);save();render();closeModal();toast('Datos restaurados desde la nube')}catch(e){toast('No se pudo restaurar: '+(e&&e.message||e))}}
async function nubeSobrescribir(){if(!confirm('¿Reemplazar la copia de la nube con los datos de ESTE dispositivo?'))return;try{await nubeGuardarEstado(true);toast('La nube ahora tiene los datos de este dispositivo');publicarNube('todo')}catch(e){toast('No se pudo: '+(e&&e.message||e))}}
function nubeGenClave(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';document.getElementById('nbTok').value=Array.from(crypto.getRandomValues(new Uint8Array(24))).map(x=>A[x%A.length]).join('')}
async function nubeCopiarCodigo(){if(!document.getElementById('nbTok').value.trim())nubeGenClave();const code=CODE_GS.replace('__TOKEN__',()=>document.getElementById('nbTok').value.trim());try{await navigator.clipboard.writeText(code);toast('Código copiado. Pegalo en Apps Script.')}catch(e){const b=document.getElementById('nbCode');b.style.display='block';b.value=code;b.select();toast('Copiá el texto que apareció abajo')}}

async function nubeGuardarConfig(){const url=document.getElementById('nbUrl').value.trim(),token=document.getElementById('nbTok').value.trim();if(!/^https:\/\/script\.google\.com\/.+/.test(url)){toast('La URL debe empezar con https://script.google.com/…');return}if(token.length<12){toast('La clave es muy corta');return}const p=NB||{};NB={url,token,auto:document.getElementById('nbAuto').checked,salt:p.salt||pubB64(crypto.getRandomValues(new Uint8Array(16))),it:p.it||600000,lastState:(p.token===token&&p.url===url)?(p.lastState||''):''};lsSet(NK,NB);_ek=null;try{const r=await apiPost('ping');if(!r.ok)throw new Error(r.err==='clave'?'la clave no coincide con la del servidor':(r.err||'sin respuesta'));nubeEstado='Conectada';toast('Conexión correcta ✔');openNube()}catch(e){toast('No se pudo conectar: '+(e&&e.message||e))}}
function nubeDesconectar(){if(!confirm('¿Desconectar la nube de este dispositivo? Tus datos locales no se borran.'))return;NB=null;try{localStorage.removeItem(NK);localStorage.removeItem(KC);localStorage.removeItem(PH)}catch(e){}nubeEstado='';render();closeModal();toast('Nube desconectada')}
function openNube(){
 const n=NB||{url:'',token:'',auto:true},ok=nubeOK();
 $('#modalBox').innerHTML=`<h2>☁️ Nube: padres online y tus datos en cualquier dispositivo</h2>
  <p class=muted>Se guarda en una planilla de TU Google, siempre cifrado.</p>
  <ol class=muted style="padding-left:18px;line-height:1.55;font-size:13px"><li>Tocá <b>Generar</b> y después <b>Copiar el código del servidor</b>.</li><li>Creá una planilla nueva (<b>sheets.new</b>) → Extensiones → Apps Script. Pegá el código.</li><li><b>Implementar → Nueva implementación → Aplicación web</b>. Ejecutar como: <b>yo</b>. Acceso: <b>Cualquier persona</b>.</li><li>Copiá la <b>URL</b> (termina en /exec), pegala abajo y tocá <b>Guardar y probar</b>.</li><li>Descargá <b>index.html</b> y subilo a tu sitio <b>una sola vez</b>.</li></ol>
  <label style="display:block;margin-top:6px">Clave de docente<br><span class=row><input id=nbTok value="${esc(n.token)}" style="flex:1;min-width:200px"><button class=ghost onclick="nubeGenClave()">Generar</button></span></label>
  <div class=row style="margin:6px 0"><button class=ghost onclick="nubeCopiarCodigo()">📋 Copiar el código del servidor</button></div><textarea id=nbCode readonly style="display:none;width:100%;min-height:120px;font-size:11px"></textarea>
  <label style="display:block;margin-top:6px">URL de la aplicación web<br><input id=nbUrl value="${esc(n.url)}" placeholder="https://script.google.com/macros/s/…/exec" style="width:100%"></label>

let _imp={}
function openImportXlsx(){if(!D||!D.cursos.length){toast('No hay cursos');return}if(!window.XLSX){toast('Cargando lector de Excel…');const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js';s.onload=()=>openImportXlsx();s.onerror=()=>toast('Sin internet: no se pudo cargar SheetJS');document.head.appendChild(s);return}const cursosOpts=D.cursos.map((c,i)=>`<option value="${i}">${esc(c.nombre)} (${c.anio})</option>`).join('');$('#modalBox').innerHTML=`<h2>Importar desde Excel</h2><p class=muted>Subí el .xlsx. Se leen todas las hojas, se detecta Asistencia y Notas, y se unen las dos tablas de Notas.</p><div class=row style="margin:8px 0"><label>Curso destino <select id=impCur>${cursosOpts}</select></label></div><div class=row><input type=file id=impFile accept=".xlsx,.xls" onchange="readXlsx(this)"></div><div id=impPv class=muted style="margin-top:10px"></div><div class=row style="margin-top:10px" id=impBtns></div>`;$('#modal').classList.add('on')}
function readXlsx(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});_imp={wb,cur:parseInt($('#impCur').value)||0,hojas:{}};const pv=[];wb.SheetNames.forEach(n=>{const sh=wb.Sheets[n];const rows=XLSX.utils.sheet_to_json(sh,{header:1,defval:''});const tipo=detectarHoja(rows,n);if(tipo)_imp.hojas[tipo]=rows;pv.push(`<div><b>${esc(n)}</b>: ${rows.length} filas → ${tipo?('detectada como <b>'+tipo+'</b>'):'ignorada'}</div>`)});const prev=previewFusion(_imp.hojas);$('#impPv').innerHTML=pv.join('')+'<hr>'+prev;$('#impBtns').innerHTML=`<button onclick="aplicarImport()">Fusionar con el curso</button><button class=ghost onclick="closeModal()">Cancelar</button>`}catch(x){toast('No se pudo leer el archivo');console.error(x)}};r.readAsArrayBuffer(f)}
function detectarHoja(rows,name){const low=(name||'').toLowerCase();if(/asist|presente|falta/.test(low))return 'asistencia';for(let r=0;r<Math.min(rows.length,6);r++){const celdas=rows[r]||[];const fechas=celdas.filter(x=>esFecha(x)).length;if(fechas>=3)return 'asistencia'}if(/nota/.test(low))return 'notas';for(let r=0;r<Math.min(rows.length,6);r++){const c=rows[r]||[];if(c.some(x=>String(x).toLowerCase()==='nombre'))return 'notas'}return null}
function esFecha(x){if(x instanceof Date)return true;if(typeof x==='number'&&x>40000&&x<60000)return true;if(typeof x==='string'&&/^\d{4}-\d{2}-\d{2}/.test(x))return true;return false}
function fechaNorm(x){if(x instanceof Date)return x.toISOString().slice(0,10);if(typeof x==='number'){const d=new Date(Date.UTC(1899,11,30)+x*86400000);return d.toISOString().slice(0,10)}if(typeof x==='string'){const m=x.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3]}return null}
function normNombre(s){return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function previewFusion(hojas){const c=C();if(!c)return '<div class=muted>Sin curso destino.</div>';let nuevasFechas=0,alumnosNuevos=0;if(hojas.asistencia){const {fechas,alumnos}=parseAsistencia(hojas.asistencia);fechas.forEach(f=>{if(!(c.asistencia||{})[f])nuevasFechas++});alumnos.forEach(a=>{if(!(c.alumnos||[]).find(x=>normNombre(x.nombre)===normNombre(a.nombre)))alumnosNuevos++})}if(hojas.notas){const {alumnos}=parseNotas(hojas.notas);alumnos.forEach(a=>{if(!(c.alumnos||[]).find(x=>normNombre(x.nombre)===normNombre(a)))alumnosNuevos++})}return `<div class=card style="margin:0"><b>Preview de fusión</b><div class=muted>Curso: ${esc(c.nombre)}</div><div>Alumnos nuevos: <b>${alumnosNuevos}</b></div><div>Fechas nuevas: <b>${nuevasFechas}</b></div></div>`}
function parseAsistencia(rows){let fr=-1;for(let r=0;r<Math.min(rows.length,8);r++){const fechas=(rows[r]||[]).filter(x=>esFecha(x)).length;if(fechas>=3){fr=r;break}}if(fr<0)return{fechas:[],alumnos:[]};const fechas=[];const colsFecha=[];(rows[fr]||[]).forEach((v,i)=>{const f=fechaNorm(v);if(f){fechas.push(f);colsFecha.push(i)}});const alumnos=[];for(let r=fr+1;r<rows.length;r++){const nombre=rows[r][1];if(!nombre||/presente|ausente|tarde|promedio|porcentaje|^total$/i.test(String(nombre)))continue;const marcas={};colsFecha.forEach((ci,k)=>{const v=String(rows[r][ci]||'').trim().toUpperCase();if(['P','A','T'].includes(v))marcas[fechas[k]]=v});alumnos.push({nombre:String(nombre).trim(),marcas})}return{fechas,alumnos}}
function parseNotas(rows){let fNombre=-1;for(let r=0;r<rows.length;r++){if(String(rows[r][1]||'').toLowerCase()==='nombre'){fNombre=r;break}}if(fNombre<0)return{alumnos:[],circuitosPorAlumno:{},notasPorAlumno:{},cierresPorAlumno:{}};const alumnos=[];const circuitosPorAlumno={};const notasPorAlumno={};const cierresPorAlumno={};const enc1=rows[fNombre-1]||[];const enc1b=rows[fNombre-2]||[];const mapa1={};enc1.forEach((v,i)=>{const s=String(v||'').trim();if(/^\d+(\.0)?$/.test(s)){const n=parseInt(s);if(n>=1&&n<=37)mapa1[i]={tipo:'circ',nro:n};else if(n===38||n===41||n===42||(n>=43&&n<=48))mapa1[i]={tipo:'ev',nro:n}}});[enc1,enc1b].forEach(enc=>{enc.forEach((v,i)=>{const s=String(v||'').trim().toLowerCase();const keys=['1er','2do','3ro','4to','nota','dic','feb','f','avance 1er cuatrimentre','avance 2do cuatrimestre'];if(keys.includes(s)&&!mapa1[i])mapa1[i]={tipo:'cie',key:s}})});for(let r=fNombre+1;r<rows.length;r++){const row=rows[r]||[];const nombre=String(row[1]||'').trim();if(!nombre||/circuitos|promedio|nombre/i.test(nombre))break;const circs=[];const notas={};const cie={};Object.entries(mapa1).forEach(([i,m])=>{const v=row[i];if(m.tipo==='circ'&&String(v||'').toUpperCase()==='X')circs.push(m.nro);else if(m.tipo==='ev'&&v!==''&&v!=null&&!/recup.*final/i.test(String(m.nro)))notas['ev'+m.nro]=v;else if(m.tipo==='cie'&&v!==''&&v!=null)cie[m.key]=v});alumnos.push(nombre);circuitosPorAlumno[nombre]=circs;notasPorAlumno[nombre]=notas;cierresPorAlumno[nombre]=cie}
let f2=-1;for(let r=fNombre+1;r<rows.length;r++){const row=rows[r]||[];const hasCirc=row.some(x=>String(x||'').toLowerCase()==='circuitos');if(hasCirc){f2=r;break}}if(f2>=0){let enc2=null;for(let k=1;k<=3;k++){const cand=rows[f2+k]||[];const nums=cand.filter(x=>/^\d+(\.0)?$/.test(String(x||'').trim())).length;if(nums>=3){enc2=cand;break}}if(enc2){const mapa2={};enc2.forEach((v,i)=>{const s=String(v||'').trim();if(/^\d+(\.0)?$/.test(s)){const n=parseInt(s);if(n>=25&&n<=48)mapa2[i]=n}});const startRow=(rows.indexOf(enc2))+1;for(let r=startRow;r<rows.length;r++){const row=rows[r]||[];const nombre=String(row[1]||'').trim();if(!nombre||/nombre|leyenda|sin fotocopias/i.test(nombre))continue;const idx=alumnos.findIndex(a=>normNombre(a)===normNombre(nombre));if(idx<0)continue;Object.entries(mapa2).forEach(([i,nro])=>{if(String(row[i]||'').toUpperCase()==='X'){const n=parseInt(nro);if(!circuitosPorAlumno[nombre].includes(n))circuitosPorAlumno[nombre].push(n)}})}}}return{alumnos,circuitosPorAlumno,notasPorAlumno,cierresPorAlumno}}
function aplicarImport(){if(!_imp.hojas||(!_imp.hojas.asistencia&&!_imp.hojas.notas)){toast('No hay hojas válidas');return}if(!confirm('¿Fusionar los datos del Excel con el curso actual?'))return;pushH();const c=C();if(_imp.hojas.asistencia){const {alumnos}=parseAsistencia(_imp.hojas.asistencia);alumnos.forEach(a=>{let al=(c.alumnos||[]).find(x=>normNombre(x.nombre)===normNombre(a.nombre));if(!al){al={id:'a'+uid(),nombre:a.nombre,alta:td(),baja:null,codigo:randCode()};c.alumnos=c.alumnos||[];c.alumnos.push(al)}Object.entries(a.marcas).forEach(([f,v])=>{c.asistencia=c.asistencia||{};c.asistencia[f]=c.asistencia[f]||{};c.asistencia[f][al.id]=v})})}if(_imp.hojas.notas){const r=parseNotas(_imp.hojas.notas);r.alumnos.forEach(nombre=>{let al=(c.alumnos||[]).find(x=>normNombre(x.nombre)===normNombre(nombre));if(!al){al={id:'a'+uid(),nombre,alta:td(),baja:null,codigo:randCode()};c.alumnos=c.alumnos||[];c.alumnos.push(al)}(r.circuitosPorAlumno[nombre]||[]).forEach(nro=>{const id='c'+String(nro).padStart(2,'0');c.circuitosHechos=c.circuitosHechos||{};c.circuitosHechos[al.id]=c.circuitosHechos[al.id]||[];if(!c.circuitosHechos[al.id].includes(id))c.circuitosHechos[al.id].push(id)});Object.entries(r.notasPorAlumno[nombre]||{}).forEach(([k,v])=>{const nro=parseInt(k.replace('ev',''));c.evaluaciones=c.evaluaciones||[];let ev=c.evaluaciones.find(e=>String(e.tema).includes(String(nro))||String(e.tipo||'').includes(String(nro)));if(!ev){ev={id:'ev_'+nro,tema:'Evaluación '+nro,tipo:''};c.evaluaciones.push(ev)}c.notas=c.notas||{};c.notas[al.id]=c.notas[al.id]||{};c.notas[al.id][ev.id]={v:v,f:td()}});Object.entries(r.cierresPorAlumno[nombre]||{}).forEach(([k,v])=>{c.cierres=c.cierres||{};c.cierres[al.id]=c.cierres[al.id]||{};const key=k==='avance 1er cuatrimentre'?'1er':k==='avance 2do cuatrimestre'?'2do':k;c.cierres[al.id][key]=v})})}c.alumnos=(c.alumnos||[]).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));save();render();closeModal();toast('Importado. Podés deshacer con ↶')}

// Publicar padres
const PUB_E=new TextEncoder();
const pubB64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const pubHex=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');
async function pubKdf(code,salt,it){const b=await crypto.subtle.importKey('raw',PUB_E.encode(code),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},b,256))}
async function pubH(k,tag){const t=PUB_E.encode(tag),m=new Uint8Array(k.length+t.length);m.set(k);m.set(t,k.length);return new Uint8Array(await crypto.subtle.digest('SHA-256',m))}
async function pubIdx(k){return pubHex((await pubH(k,'idx')).slice(0,12))}
async function pubSeal(k,o){const iv=crypto.getRandomValues(new Uint8Array(12)),ek=await crypto.subtle.importKey('raw',await pubH(k,'enc'),'AES-GCM',false,['encrypt']);return{i:pubB64(iv),c:pubB64(await crypto.subtle.encrypt({name:'AES-GCM',iv},ek,PUB_E.encode(JSON.stringify(o))))}}
function pubPayload(c,s){
 let p=0,a=0,t=0;const last=[];
 Object.keys(c.asistencia||{}).sort().forEach(d=>{const v=((c.asistencia||{})[d]||{})[s.id];if(v){v==='P'?p++:v==='A'?a++:t++;last.push([d,v])}});
 const fot={};(c.fotocopias&&c.fotocopias[s.id]||{});Object.entries(c.fotocopias&&c.fotocopias[s.id]||{}).forEach(([tema,n])=>{if(n>0)fot[tema]=n});
 let materias;
 if(c.materias&&c.materias.length){
  materias=c.materias.map(m=>{
   const notas=m.evaluaciones.map(e=>[e.tema+(e.tipo?' · '+e.tipo:''),notaDe(((c.notas||{})[s.id]||{})[e.id])]).filter(x=>x[1]!==undefined&&x[1]!==''&&x[1]!==null);
   const prac=(m.practicas||[]).map(pr=>{const hechos=(c.practicasHechas||{})[s.id]||[];const partes=[...Array(pr.partes)].map((_,i)=>hechos.includes(pr.id+'_'+(i+1)));return {nombre:pr.nombre,partes,total:pr.partes}});
   const cie={};(m.cierres||[]).forEach(k=>{const v=(c.cierres||{})[s.id]?.[m.id+'_'+k];if(v!=null&&v!=='')cie[k]=v});
   return {id:m.id,nombre:m.nombre,notas,practicas:prac,cierres:cie,rec:temasPendMateria(c,s.id,m),fot};
  });
 }else{
  const gr=(c.evaluaciones||[]).map(e=>[evLabel(c,e),notaDe(((c.notas||{})[s.id]||{})[e.id])]).filter(x=>x[1]!==undefined&&x[1]!=='');
  const conCirc=usaCirc(c);
  const circ=conCirc?catArr().map(x=>{const id='c'+String(x.nro).padStart(2,'0');return[x.nro+' — '+x.nombre,circHechos(c,s.id).includes(id)]}):[];
  const cie=(c.cierres||{})[s.id]||{};
  materias=[{id:'unica',nombre:c.materia||'Materia',notas:gr,practicas:[],cierres:cie,circuitos:circ,rec:temasPend(c,s.id),fot}];
 }
 return{n:s.nombre,c:c.nombre,m:c.materia||'',u:td(),p,a,t,last:last.slice(-12).reverse(),materias,obs:obsPublic(c,s.id)};
}
let _pub=false;
async function publicarPadres(){
 if(nubeOK()){publicarNube('todo');return}
 if(_pub)return;if(!D||!D.cursos.length){toast('No hay cursos');return}
 const lista=[];D.cursos.forEach(c=>(c.alumnos||[]).forEach(s=>{if(s.codigo&&!s.baja)lista.push([c,s])}));
 if(!lista.length){toast('No hay alumnos con código');return}
 _pub=true;
 try{
  const IT=600000,salt=crypto.getRandomValues(new Uint8Array(16)),snap={};let n=0;
  for(const[c,s]of lista){toast('Generando '+(++n)+' de '+lista.length+'…');const k=await pubKdf(s.codigo,salt,IT);snap[await pubIdx(k)]=await pubSeal(k,pubPayload(c,s))}
  const payload={v:2,generado:new Date().toISOString(),it:IT,salt:pubB64(salt),cursos:D.cursos.length,alumnos:lista.length,snap};
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='datos-padres.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Listo: '+lista.length+' alumnos. Subí datos-padres.json junto a index.html');
 }catch(e){console.error(e);toast('No se pudo generar el archivo')}finally{_pub=false}

const esNombre=s=>{s=String(s==null?'':s).trim();return s.length>=4&&/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{2}/.test(s)&&!/^\d+([.,]\d+)?$/.test(s)&&!NO_NOMBRE.test(s)};
const limpiaNombre=s=>String(s==null?'':s).replace(/[?¿]/g,'').replace(/\s+/g,' ').replace(/[,;]+\s*$/,'').trim();
function unicos(arr){const seen=new Set(),out=[];arr.forEach(n=>{const k=normNombre(n);if(k&&!seen.has(k)){seen.add(k);out.push(n)}});return out}
function listaDesdeTexto(txt){return unicos(String(txt||'').split(/\r?\n/).map(limpiaNombre).filter(esNombre))}
function parseListaAlumnos(rows){rows=(rows||[]).map(r=>(Array.isArray(r)?r:[]).map(x=>x==null?'':String(x).trim()));let ape=-1,nom=-1,uni=-1,hr=-1;for(let r=0;r<Math.min(rows.length,12);r++){ape=nom=uni=-1;rows[r].forEach((v,i)=>{const l=v.toLowerCase();if(/^apellidos?$/.test(l))ape=i;else if(/^nombres?$/.test(l))nom=i;else if(/^(apellido\s*(y|,)\s*nombres?|nombres?\s*y\s*apellido|alumn[oa]s?|estudiantes?|nombre completo)$/.test(l))uni=i});if(ape>=0||nom>=0||uni>=0){hr=r;break}}let col=-1,start=0;const W=Math.max(0,...rows.map(r=>r.length));if(hr>=0){start=hr+1;col=(ape>=0&&nom>=0)?-1:(uni>=0?uni:(ape>=0?ape:nom))}else{for(let c=0;c<Math.min(W,3)&&col<0;c++){const nums=rows.map((r,i)=>[i,/^\d{1,3}(\.0)?$/.test(r[c]||'')?parseInt(r[c]):-1]).filter(x=>x[1]>=0);if(nums.length>=5&&nums[0][1]<=2){col=c+1;start=nums[0][0]}}if(col<0){let best=0;for(let c=0;c<Math.min(W,6);c++){const n=rows.filter(r=>esNombre(r[c])).length;if(n>best){best=n;col=c}}}}const out=[];for(let r=start;r<rows.length;r++){const row=rows[r],n=limpiaNombre((hr>=0&&ape>=0&&nom>=0)?[row[ape],row[nom]].filter(Boolean).join(', '):row[col]);if(esNombre(n))out.push(n)}return unicos(out)}
function ensureXLSX(ok){if(window.XLSX)return ok();toast('Cargando lector de Excel…');const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js';s.onload=ok;s.onerror=()=>toast('Sin internet: no se pudo cargar el lector de Excel.');document.head.appendChild(s)}

function leerListaArchivo(inp,ta,msg){const f=inp.files[0];if(!f)return;const m=document.getElementById(msg);const poner=(names,de)=>{document.getElementById(ta).value=names.join('\n');if(m)m.textContent=names.length+' alumnos encontrados'+(de?' en '+de:'')+'.'};const r=new FileReader();if(/\.txt$/i.test(f.name)){r.onload=e=>poner(listaDesdeTexto(e.target.result),f.name);r.readAsText(f);return}ensureXLSX(()=>{r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});let found=null,hoja='';for(const n of wb.SheetNames){const names=parseListaAlumnos(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}));if(names.length>=3){found=names;hoja=n;break}}if(!found)throw new Error('no encontré una lista de alumnos');poner(found,'la hoja “'+hoja+'”')}catch(x){if(m)m.textContent='No pude leer la lista ('+x.message+')'}};r.readAsArrayBuffer(f)})}

24}$/.test(k))continue;mapa[k]=['x'+k,'x'+items[k].i,'x'+items[k].c,ahora];keep[k]=1}var final=[];for(k in mapa){if(keep[k])final.push(mapa[k])}h.clearContents();if(final.length)h.getRange(1,1,final.length,4).setValues(final);setMeta_({salt:b.salt,it:b.it,gen:ahora});return salida_({ok:true,n:final.length,gen:ahora});}if(b.a==='save'){m=meta_();if(!b.force&&m.estado_ts&&b.base!==m.estado_ts)return salida_({ok:false,err:'conflicto',ts:m.estado_ts});var s=String(b.blob||''),hh=hoja_('estado'),rows=[];for(i=0;i<s.length;i+=40000)rows.push(['x'+s.slice(i,i+40000)]);hh.clearContents();if(rows.length)hh.getRange(1,1,rows.length,1).setValues(rows);setMeta_({estado_ts:ahora});return salida_({ok:true,ts:ahora});}if(b.a==='state'){m=meta_();var fs=leer_(hoja_('estado')),t='';for(i=0;i<fs.length;i++)t+=String(fs[i][0]).slice(1);return salida_({ok:true,blob:t,ts:m.estado_ts||''})}return salida_({ok:false,err:'accion'});}catch(err){return salida_({ok:false,err:String(err)})}finally{if(tomado){try{lock.releaseLock()}catch(x){}}}}\n";

<p id=msg role=status><\/p><\/div>\n <div id=rep><\/div>\n <footer class=muted>${gen?'Datos actualizados el '+new Date(gen).toLocaleString('es-AR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}):''}<br>Si no tenés el código, pedíselo al docente del curso.<\/footer>`;\n $('#cd').addEventListener('keydown',e=>{if(e.key==='Enter')ver()});\n if(sv&&META)ver();\n}\nasync function ver(){\n const code=$('#cd').value.toUpperCase().replace(/[^A-Z0-9]/g,''),m=$('#msg'),b=$('#vb');\n if(!code){m.textContent='Escribí el código.';return}\n if(code.length!==8){m.textContent='El código tiene 8 letras y números (XXXX-XXXX).';return}\n if(!META&&API){m.textContent='Conectando…';await cargar()}\n if(!META){m.textContent=SINRED?'No se pudo conectar.':'Todavía no hay información publicada.';return}\n b.disabled=true;m.textContent='Verificando…';\n try{\n  let p=null;\n  if(API){const k=await kdf(code,ub(META.salt),META.it),r=await fetch(API+'?a=get&k='+await idxOf(k),{cache:'no-store'}),j=await r.json();if(j&&j.ok)p=await dec2(k,{i:j.i,c:j.c})}\n  else if(META.v===2){const k=await kdf(code,ub(META.salt),META.it),e=SNAP[await idxOf(k)];if(e)p=await dec2(k,e)}\n  else{const e=SNAP[await sha1('i:'+code)];if(e)p=await dec1(code,e)}\n  if(!p){m.textContent='Código no encontrado.';$('#rep').innerHTML='';try{localStorage.removeItem('pcod')}catch(x){}return}\n  m.textContent='';try{localStorage.setItem('pcod',code)}catch(x){}\n  mostrar(p);\n }catch(x){m.textContent='No se pudo abrir con ese código.';$('#rep').innerHTML=''}\n finally{b.disabled=false}\n}\nconst isN=v=>/^\\d+([.,]\\d+)?$/.test(String(v).trim()),nv=v=>parseFloat(String(v).replace(',','.'));\nfunction nota(v){if(isN(v))return`<b class=\"${nv(v)<7?'no':''}\">${esc(v)}<\/b>`;const u=String(v).toUpperCase();\n if(u==='TEA')return'<span class=\"pill ok\">TEA<\/span>';if(u==='TEP')return'<span class=\"pill wa\">TEP<\/span>';if(u==='TED')return'<span class=\"pill\" style=\"background:rgba(142,68,173,.2);color:#8e44ad\">TED<\/span>';\n if(u==='A')return'<span class=muted>Ausente<\/span>';if(u==='X')return'<span class=ok>✔<\/span>';return`<b>${esc(v)}<\/b>`}\nfunction recLegacy(p){const g={};(p.gr||[]).forEach(x=>{const t=String(x[0]).split(' · ')[0];(g[t]=g[t]||[]).push(x[1])});return Object.keys(g).filter(t=>{const n=g[t].filter(isN).map(nv);return n.length&&Math.max(...n)<7})}\nfunction mostrar(p){\n const tot=p.p+p.a+p.t,pc=tot?Math.round((p.p+p.t)/tot*100):null;\n const rec=Array.isArray(p.rec)?p.rec:recLegacy(p);\n let h=`<h1>${esc(p.n)}<\/h1><p class=muted style=\"margin-bottom:10px\">${esc(p.c)}${p.m?' · '+esc(p.m):''} · actualizado ${fdl(p.u)}<\/p>`;\n h+=`<div class=card><h2>Asistencia<\/h2>${pc===null?'<p class=muted>Todavía no hay clases registradas.<\/p>':`<div class=grid>\n  <div><div class=\"big ${pc<75?'no':pc<85?'':'ok'}\" style=\"${pc>=75&&pc<85?'color:var(--wa)':''}\">${pc}%<\/div><div class=muted>asistencia<\/div><\/div>\n  <div><div class=big>${p.p}<\/div><div class=muted>presentes<\/div><\/div>\n  <div><div class=\"big ${p.a?'no':''}\">${p.a}<\/div><div class=muted>ausentes<\/div><\/div>\n  <div><div class=big>${p.t}<\/div><div class=muted>tarde<\/div><\/div><\/div>\n  ${pc<75?'<div class=alert>⚠ La asistencia está por debajo del 75 %. Conviene hablar con el docente.<\/div>':''}\n  ${p.last.length?`<div class=chips>${p.last.slice().reverse().map(x=>`<span class=\"chip ${x[1]}\"><b>${{P:'P',A:'A',T:'T'}[x[1]]||''}<\/b><i>${fd(x[0])}<\/i><\/span>`).join('')}<\/div>`:''}`}<\/div>`;\n if((p.obs||[]).length)h+=`<div class=card><h2>Observaciones del docente<\/h2>${p.obs.map(o=>`<div class=item><span>${esc(o[1])}<\/span><span class=muted>${fd(o[0])}<\/span><\/div>`).join('')}<\/div>`;\n if(p.materias){\n  p.materias.forEach(m=>{\n   h+=`<div class=card><h2>${esc(m.nombre)}<\/h2>`;\n   if(m.circuitos&&m.circuitos.length){const ch=m.circuitos.filter(x=>x[1]).length,ct=m.circuitos.length,cp=ct?Math.round(ch/ct*100):0;h+=`<p>Circuitos: <b>${ch}<\/b> de <b>${ct}<\/b><\/p><div class=bar><i style=\"width:${cp}%\"><\/i><\/div>${m.circuitos.map(x=>`<div class=item><span>${esc(x[0])}<\/span><span class=\"${x[1]?'ok':'muted'}\">${x[1]?'✔ Hecho':'Pendiente'}<\/span><\/div>`).join('')}`}\n   if((m.notas||[]).length){h+='<div style=\"margin-top:8px\"><b>Notas<\/b><\/div>'+m.notas.map(x=>`<div class=item><span>${esc(x[0])}<\/span>${nota(x[1])}<\/div>`).join('')}else h+='<p class=muted>Sin notas.<\/p>';\n   if((m.practicas||[]).length){m.practicas.forEach(pr=>{const he=pr.partes.filter(Boolean).length;h+=`<div style=\"margin-top:10px\"><b>${esc(pr.nombre)}<\/b>: ${he}\/${pr.total}<\/div><div class=bar><i style=\"width:${Math.round(he\/pr.total*100)}%\"><\/i><\/div><div class=row style=\"flex-wrap:wrap;margin-top:4px\">`;pr.partes.forEach((ok,i)=>h+=`<span class=\"pill ${ok?'ok':'no'}\">P${i+1}<\/span>`);h+='<\/div>'})}\n   if(m.cierres&&Object.keys(m.cierres).length){h+='<div style=\"margin-top:10px\"><b>Cierres<\/b><\/div>'+Object.entries(m.cierres).map(([k,v])=>`<div class=item><span>${esc(k)}<\/span>${nota(v)}<\/div>`).join('')}\n   if((m.rec||[]).length)h+=`<div style=\"margin-top:10px\"><b>Temas a recuperar<\/b><\/div>${m.rec.map(t=>`<span class=\"pill no\">${esc(t)}<\/span>`).join('')}`;\n   h+='<\/div>';\n  });\n }\n if(rec.length&&!p.materias)h+=`<div class=card><h2>Temas a recuperar<\/h2>${rec.map(t=>`<span class=\"pill no\">${esc(t)}<\/span>`).join('')}<\/div>`;\n if((p.materias||[]).some(m=>Object.keys(m.fot||{}).length)){\n  h+=`<div class=card><h2>Fotocopias que no trajo<\/h2>`;\n  (p.materias||[]).forEach(m=>{const f=m.fot||{};const l=Object.entries(f).filter(([t,n])=>n>0);if(l.length){h+=`<div style=\"margin-top:6px\"><b>${esc(m.nombre)}<\/b><\/div>`;l.forEach(([t,n])=>h+=`<div class=item><span>${esc(t)}<\/span><b class=no>${n}<\/b><\/div>`)}});\n  h+=`<p class=note>“No trajo la fotocopia” no afecta la nota, pero ayuda a saber si falta material.<\/p><\/div>`;\n }\n h+=`<div class=\"card noprint\" style=\"text-align:center\"><div class=row style=\"justify-content:center\"><button class=ghost onclick=\"print()\">Imprimir<\/button><button class=ghost onclick=\"salir()\">Consultar otro código<\/button><\/div><\/div>`;\n $('#rep').innerHTML=h;\n}\nfunction salir(){try{localStorage.removeItem('pcod')}catch(e){}inicio()}\n(async()=>{await cargar();inicio()})();\n<\/script><\/body><\/html>\n";
