<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi curso</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#e1e5ea;--ac:#2a62d9;--ok:#1f9d55;--no:#d64545;--wa:#d9890f;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181e;--card:#1d232c;--tx:#e8ecf1;--mu:#93a0b1;--bd:#2c3542;--ac:#6b95f0;--ok:#43c27a;--no:#f07070;--wa:#e9a73e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1200px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:0}h2{font-size:16px;margin:14px 0 8px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:8px 11px}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}
button.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.danger{background:var(--no)}
button:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.tabs button{background:var(--card);color:var(--mu);border:1px solid var(--bd);white-space:nowrap;font-weight:500}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px;margin-bottom:9px}
.muted{color:var(--mu);font-size:13px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 7px;border-bottom:1px solid var(--bd);text-align:center;font-size:13px}
th{font-size:12px;font-weight:600;vertical-align:bottom;background:var(--card);position:sticky;top:0;z-index:1}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:2;min-width:160px;font-weight:500}
.cell{width:28px;min-width:28px;height:26px;border:0;background:transparent;text-align:center;font-weight:600;cursor:pointer;border-radius:5px;padding:0;font-size:12px}
.cell.P{background:var(--ok);color:#fff}.cell.A{background:var(--no);color:#fff}.cell.T{background:var(--wa);color:#fff}
.cell.X{background:var(--ok);color:#fff}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;font-size:12px;background:var(--bd);color:var(--mu)}
.chip.ok{background:var(--ok);color:#fff}.chip.no{background:var(--no);color:#fff}.chip.wa{background:var(--wa);color:#fff}
.rot{writing-mode:vertical-rl;transform:rotate(180deg);max-height:140px;margin:0 auto;font-weight:500;font-size:11px}
.num{width:44px;min-width:44px;border:1px solid transparent;background:transparent;text-align:center;font-weight:600;padding:4px 2px;border-radius:5px;font-size:12px}
.num:focus{outline:2px solid var(--ac);background:var(--card)}
.num.bad{color:var(--no)}.num.okk{color:var(--ok)}
.num.tea{background:rgba(31,157,85,.18);color:var(--ok)}
.num.tep{background:rgba(217,137,15,.2);color:var(--wa)}
.num.aus{color:var(--mu);font-style:italic}
.grp{background:var(--bd);font-weight:600}
.pill{display:inline-flex;padding:3px 9px;border-radius:9px;background:var(--bd);font-size:12px;margin:2px}
.pill.no{background:rgba(214,69,69,.15);color:var(--no)}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;display:none;font-size:13px;z-index:99}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:100}
#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:14px;padding:14px;max-width:720px;width:100%;max-height:88vh;overflow:auto;position:relative;padding-top:36px}
#modal .x{position:absolute;top:8px;right:10px;background:transparent;border:0;color:var(--mu);font-size:22px;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:8px}
#modal .x:hover{background:var(--bd);color:var(--tx)}
#modal textarea{width:100%;min-height:140px;font-family:ui-monospace,monospace;font-size:12px}
.hero{text-align:center;padding:30px 14px}
.hero .big{font-size:22px;font-weight:700;margin-bottom:8px}
.pl-btn{width:40px;height:36px;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:7px;font-weight:700;font-size:14px;cursor:pointer;padding:0}
.pl-btn.P{background:var(--ok);color:#fff}.pl-btn.A{background:var(--no);color:#fff}.pl-btn.T{background:var(--wa);color:#fff}
@media print{.tabs,header,button,.noprint{display:none!important}.wrap{overflow:visible}}
</style></head><body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="box"><button class="x" onclick="closeModal()" title="Cerrar">✕</button><div id="modalBox"></div></div></div>
<script>
console.log('Mi curso v6 cargado');
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const KEY='micurso-v6';
const uid=()=>Math.random().toString(36).slice(2,9);
const td=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=d=>d?d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4).slice(2):'';
const fc=c=>c?c.slice(0,4)+'-'+c.slice(4):'';
let D=null,cur=0,tab='asist',edit=false,timer;
let HIST=[];
const C=()=>D.cursos[cur];
const catArr=()=>Object.values(D.circuitos||{}).sort((a,b)=>a.nro-b.nro);
const parseNum=v=>{if(v==null||v==='')return null;const s=String(v).replace(',','.').trim();if(/^-?\d+(\.\d+)?$/.test(s))return parseFloat(s);return null};
const gcls=v=>{if(v==null||v==='')return'';const n=parseNum(v);if(n!=null)return n<6?'bad':'okk';const u=String(v).toUpperCase();return{TEA:'tea',TEP:'tep',A:'aus',X:'aus','-':'aus','NE':'aus'}[u]||''};

function statsAsist(c,s){try{let p=0,a=0,t=0;const asis=c.asistencia||{};for(const f in asis){const v=asis[f][s.id];if(!v)continue;if(v==='P')p++;else if(v==='A')a++;else t++}const n=p+a+t;return{n,p,a,t,pc:n?Math.round((p+t)/n*100):null}}catch(e){return{n:0,p:0,a:0,t:0,pc:null}}}
function circHechos(c,id){return (c.circuitosHechos||{})[id]||[]}
function tieneCircuitos(c){if(!c)return false;if(c.tieneCircuitos!==undefined)return !!c.tieneCircuitos;const cols=c.cierreCols||[];return !cols.some(k=>['Dic','Feb','F','4to','nota'].includes(k))}
function temasDe(c){try{return [...new Set((c.evaluaciones||[]).map(e=>e.tema))]}catch(e){return[]}}
function mejorTema(c,id,tema){try{const evs=(c.evaluaciones||[]).filter(e=>e.tema===tema);let best=null;evs.forEach(e=>{const v=((c.notas||{})[id]||{})[e.id];if(v!=null&&v!==''){const n=parseNum(v);if(n!=null&&(best==null||n>best))best=n}});return best}catch(e){return null}}
function cierreFinal(c,id){try{const cc=(c.cierres||{})[id]||{};const nums=[];let bajo=false,tea=false;['1er','2do','3ro','4to'].forEach(k=>{const v=cc[k];if(v==null||v==='')return;const n=parseNum(v);if(n!=null){nums.push(n);if(n<6)bajo=true}else{if(String(v).toUpperCase()==='TEA')tea=true}});const prom=nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:null;let estado='';if(nums.length===0&&!tea)estado='Sin datos';else if(bajo)estado='A recuperar';else if(prom!=null&&prom<6)estado='A recuperar';else if(prom!=null||tea)estado='Aprobado';return{prom:prom!=null?Math.round(prom*10)/10:null,estado}}catch(e){return{prom:null,estado:'Sin datos'}}}

function temasDeMateria(m){return [...new Set((m.evaluaciones||[]).map(e=>e.tema))]}
function mejorTemaMateria(c,id,m,tema){
 const evs=(m.evaluaciones||[]).filter(e=>e.tema===tema);
 let best=null;
 evs.forEach(e=>{const v=((c.notas||{})[id]||{})[e.id];if(v!=null&&v!==''){const n=parseNum(v);if(n!=null&&(best==null||n>best))best=n}});
 return best;
}
function cierreFinalMateria(c,id,m){
 try{
  const cc=(c.cierres||{})[id]||{};
  const nums=[];let bajo=false,tea=false;
  ['1er','2do','3ro','4to'].forEach(k=>{
   const v=cc[m.id+'_'+k];
   if(v==null||v==='')return;
   const n=parseNum(v);
   if(n!=null){nums.push(n);if(n<6)bajo=true}
   else{if(String(v).toUpperCase()==='TEA')tea=true}
  });
  const prom=nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:null;
  let estado='';
  if(nums.length===0&&!tea)estado='Sin datos';
  else if(bajo)estado='A recuperar';
  else if(prom!=null&&prom<6)estado='A recuperar';
  else if(prom!=null||tea)estado='Aprobado';
  return{prom:prom!=null?Math.round(prom*10)/10:null,estado};
 }catch(e){return{prom:null,estado:'Sin datos'}}
}

function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return null}
function save(){clearTimeout(timer);timer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('No se pudo guardar')}},250)}
function pushH(){HIST.push(JSON.stringify(D));if(HIST.length>40)HIST.shift()}
function undo(){if(!HIST.length){toast('Nada para deshacer');return}D=JSON.parse(HIST.pop());if(cur>=D.cursos.length)cur=0;save();render();toast('Deshecho')}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}
function setTab(k){tab=k;render()}
function toggleEdit(){edit=!edit;clearTimeout(window._e);if(edit)window._e=setTimeout(()=>{edit=false;render()},10*60000);render()}

function render(){
 const app=$('#app');
 if(!D){app.innerHTML='<div class=hero><div class=big>🎓 Mi curso</div><p class=muted>Cargá un JSON o creá un curso con <b>+ Curso</b>.</p><div class=row style="justify-content:center"><button onclick="addCurso()">+ Curso</button><button class=ghost onclick="openImportJSON()">📂 Cargar JSON</button><button class=ghost onclick="blank()">Empezar vacío</button></div></div>';return}
 const c=C();
 let h=`<header><h1>🎓 Mi curso</h1><div class=row>
  ${D.cursos.length?`<select onchange="cur=+this.value;render()">${D.cursos.map((x,i)=>`<option value=${i} ${i==cur?'selected':''}>${esc(x.nombre)} (${x.anio||''})</option>`).join('')}</select>`:''}
  <button class=ghost onclick="addCurso()">+ Curso</button>
  <button class=ghost onclick="expJSON()">⬇ Exportar</button>
  <button class=ghost onclick="publicarPadres()">📤 Publicar padres</button>
  <button class=ghost onclick="openImportJSON()">📂 Cargar JSON</button>
  <button class=ghost onclick="nuevoAnio()">📅 Nuevo año</button>
  <button class=ghost onclick="borrarCurso()">🗑 Borrar curso</button>
  <button class=ghost onclick="undo()">↶ Deshacer</button>
  <button class=ghost onclick="toggleEdit()">${edit?'✏️ Editando':'🔒 Ver'}</button>
 </div></header>`;
 if(!c){app.innerHTML=h+'<div class=card>Sin cursos. Tocá <b>+ Curso</b> o <b>📂 Cargar JSON</b>.</div>';return}
 h+=`<div class=tabs>${[['asist','Asistencia'],['circ','Circuitos'],['eval','Evaluaciones'],['cie','Cierres'],['alum','Alumnos'],['rep','Reportes'],['pad','Padres']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div>`;
 h+=`<div class=muted style="margin-bottom:6px">${esc(c.materia||'')}${c.docente?' · '+esc(c.docente):''} · ${(c.alumnos||[]).length} alumnos · ${c.anio||''}</div>`;
 let fn={asist:vAsist,circ:vCirc,eval:vEval,cic:vCie,alum:vAlum,rep:vRep,pad:vPad}[tab]||vAsist;
 let body='';try{body=fn(c)}catch(e){console.error(e);body='<div class=card>Error: '+esc(e.message)+'</div>'}
 h+=body;app.innerHTML=h;
}

function vAsist(c){const fechas=Object.keys(c.asistencia||{}).sort();let h=`<div class=card><b>Asistencia</b> — ${fechas.length} clases <button class=ghost onclick="pasarListaHoy()" style="float:right">📅 Pasar lista hoy</button></div><div class="card wrap"><table><thead><tr><th>Alumno</th>`;fechas.forEach(f=>h+=`<th><div class=rot>${fd(f)}</div></th>`);h+='<th>%</th></tr></thead><tbody>';(c.alumnos||[]).forEach(s=>{const st=statsAsist(c,s);h+=`<tr><td>${esc(s.nombre)}</td>`;fechas.forEach(f=>{const v=((c.asistencia||{})[f]||{})[s.id]||'';h+=`<td><button class="cell ${v}" onclick="setA('${f}','${s.id}')">${v||'·'}</button></td>`});h+=`<td><span class="chip ${st.pc<75?'no':'ok'}">${st.pc??'-'}%</span></td></tr>`});h+='</tbody></table></div>';return h}
function setA(f,id){if(!edit){toast('Activá edición');return}pushH();const c=C();c.asistencia=c.asistencia||{};c.asistencia[f]=c.asistencia[f]||{};const o=['','P','A','T'];const cur=c.asistencia[f][id]||'';c.asistencia[f][id]=o[(o.indexOf(cur)+1)%4];if(!c.asistencia[f][id])delete c.asistencia[f][id];save();render()}
function pasarListaHoy(){if(!edit){toast('Activá edición');return}const f=td();const c=C();c.asistencia=c.asistencia||{};if(!c.asistencia[f]){pushH();c.asistencia[f]={}}const day=c.asistencia[f]||{};let html=`<h2>Pasar lista ${fd(f)}</h2><div class=row><button class=ghost onclick="marcarTodos('P')">Todos P</button><button class=ghost onclick="marcarTodos('A')">Todos A</button></div><div style="max-height:60vh;overflow:auto">`;(c.alumnos||[]).forEach(s=>{const v=day[s.id]||'';html+=`<div class="pl-row" data-id="${s.id}" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)"><span>${esc(s.nombre)}</span><span class=row><button class="pl-btn ${v==='P'?'P':''}" data-v="P" onclick="markPL('${s.id}','P')">P</button><button class="pl-btn ${v==='A'?'A':''}" data-v="A" onclick="markPL('${s.id}','A')">A</button><button class="pl-btn ${v==='T'?'T':''}" data-v="T" onclick="markPL('${s.id}','T')">T</button></span></div>`});html+=`</div><div class=row style="margin-top:10px"><button onclick="closeModal();render()">Guardar</button></div>`;$('#modalBox').innerHTML=html;$('#modal').classList.add('on')}
function markPL(id,val){const f=td();const c=C();c.asistencia=c.asistencia||{};c.asistencia[f]=c.asistencia[f]||{};if(c.asistencia[f][id]===val)delete c.asistencia[f][id];else c.asistencia[f][id]=val;save();const row=document.querySelector(`.pl-row[data-id="${id}"]`);if(row){const actual=c.asistencia[f][id]||'';row.querySelectorAll('.pl-btn').forEach(b=>b.classList.toggle(b.dataset.v,b.dataset.v===actual))}}
function marcarTodos(v){const f=td();const c=C();c.asistencia=c.asistencia||{};c.asistencia[f]=c.asistencia[f]||{};(c.alumnos||[]).forEach(s=>{if(v==='')delete c.asistencia[f][s.id];else c.asistencia[f][s.id]=v});save();document.querySelectorAll('.pl-row').forEach(row=>{const id=row.dataset.id;const actual=c.asistencia[f][id]||'';row.querySelectorAll('.pl-btn').forEach(b=>b.classList.toggle(b.dataset.v,b.dataset.v===actual))})}

function vCirc(c){const cats=catArr();if(!tieneCircuitos(c))return '<div class=card>Materia sin circuitos.</div>';let h='<div class="card wrap"><table><thead><tr><th>Alumno</th>';cats.forEach(x=>h+=`<th title="${esc(x.nombre)}"><div class=rot>${x.nro} — ${esc(x.nombre)}</div></th>`);h+='<th>Hechos</th></tr></thead><tbody>';(c.alumnos||[]).forEach(s=>{const he=new Set(circHechos(c,s.id));h+=`<tr><td>${esc(s.nombre)}</td>`;cats.forEach(x=>{const id='c'+String(x.nro).padStart(2,'0');const v=he.has(id);h+=`<td><button class="cell ${v?'X':''}" onclick="tgC('${s.id}','${id}')">${v?'X':'·'}</button></td>`});h+=`<td>${he.size}/${cats.length}</td></tr>`});h+='</tbody></table></div>';return h}
function tgC(id,cidv){if(!edit){toast('Activá edición');return}const c=C();const al=(c.alumnos||[]).find(x=>x.id===id);const cat=D.circuitos?D.circuitos[cidv]:null;const nombreCi=cat?cat.nro+' — '+cat.nombre:cidv;const hechos=(c.circuitosHechos||{})[id]||[];const ya=hechos.includes(cidv);if(!confirm('¿'+(ya?'Desmarcar':'Marcar')+' "'+nombreCi+'" para '+al.nombre+'?'))return;pushH();c.circuitosHechos=c.circuitosHechos||{};c.circuitosHechos[id]=hechos.filter(x=>x!==cidv);if(!ya)c.circuitosHechos[id].push(cidv);save();render()}

function vEval(c){
 if(c.materias&&c.materias.length){
  const mid=c._matSel||c.materias[0].id;
  const m=c.materias.find(x=>x.id===mid)||c.materias[0];
  const sel=c.materias.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.nombre)}</option>`).join('');
  let h=`<div class=card><div class=row style="justify-content:space-between"><b>Evaluaciones</b><select onchange="C()._matSel=this.value;render()">${sel}</select></div></div>`;
  const temas=temasDeMateria(m);
  h+='<div class="card wrap"><table><thead><tr><th>Alumno</th>';
  temas.forEach(t=>{
   m.evaluaciones.filter(e=>e.tema===t).forEach(e=>h+=`<th><div class=rot>${esc(t)} · ${esc(e.tipo||'')}</div></th>`);
   h+=`<th class=grp><div class=rot>Mejor ${esc(t)}</div></th>`;
  });
  h+='</tr></thead><tbody>';
  (c.alumnos||[]).forEach(s=>{
   h+=`<tr><td>${esc(s.nombre)}</td>`;
   temas.forEach(t=>{
    m.evaluaciones.filter(e=>e.tema===t).forEach(e=>{
     const v=((c.notas||{})[s.id]||{})[e.id];
     h+=`<td><input class="num ${gcls(v)}" value="${esc(v??'')}" ${edit?'':'readonly'} onchange="setN('${s.id}','${e.id}',this.value)"></td>`;
    });
    const m2=mejorTemaMateria(c,s.id,m,t);
    h+=`<td class=grp><b>${m2??'—'}</b></td>`;
   });
   h+='</tr>';
  });
  h+='</tbody></table></div>';
  if(m.practicas&&m.practicas.length){
   m.practicas.forEach(p=>{
    h+=`<div class=card><b>${esc(p.nombre)}</b> — ${p.partes} partes</div>`;
    h+='<div class="card wrap"><table><thead><tr><th>Alumno</th>';
    for(let i=1;i<=p.partes;i++)h+=`<th><div class=rot>Parte ${i}</div></th>`;
    h+='<th>Hechas</th></tr></thead><tbody>';
    (c.alumnos||[]).forEach(s=>{
     const he=new Set((c.practicasHechas||{})[s.id]||[]);
     h+=`<tr><td>${esc(s.nombre)}</td>`;
     for(let i=1;i<=p.partes;i++){
      const id='pt_morza_'+i;
      const v=he.has(id);
      h+=`<td><button class="cell ${v?'X':''}" onclick="tgP('${s.id}','${id}')">${v?'X':'·'}</button></td>`;
     }
     h+=`<td><b>${[...Array(p.partes)].filter((_,i)=>he.has('pt_morza_'+(i+1))).length}</b>/${p.partes}</td></tr>`;
    });
    h+='</tbody></table></div>';
   });
  }
  return h;
 }
 if(!c.evaluaciones||!c.evaluaciones.length)return '<div class=card>Sin evaluaciones.</div>';
 const temas=temasDe(c);
 let h='<div class="card wrap"><table><thead><tr><th>Alumno</th>';
 temas.forEach(t=>{c.evaluaciones.filter(e=>e.tema===t).forEach(e=>h+=`<th><div class=rot>${esc(t)} · ${esc(e.tipo||'')}</div></th>`);h+=`<th class=grp>Mejor ${esc(t)}</th>`});
 h+='</tr></thead><tbody>';
 (c.alumnos||[]).forEach(s=>{
  h+=`<tr><td>${esc(s.nombre)}</td>`;
  temas.forEach(t=>{
   c.evaluaciones.filter(e=>e.tema===t).forEach(e=>{const v=((c.notas||{})[s.id]||{})[e.id];h+=`<td><input class="num ${gcls(v)}" value="${esc(v??'')}" ${edit?'':'readonly'} onchange="setN('${s.id}','${e.id}',this.value)"></td>`});
   h+=`<td class=grp>${mejorTema(c,s.id,t)??'—'}</td>`;
  });
  h+='</tr>';
 });
 h+='</tbody></table></div>';return h;
}

function openImportJSON(){
 $('#modalBox').innerHTML=`<h2>Cargar JSON</h2>
  <p class=muted>Elegí el archivo .json o pegá el texto. Podés <b>agregar</b> los cursos del archivo a los que ya tenés, o <b>reemplazar</b> todo.</p>
  <div class=row style="margin:8px 0">

    </label>
    <span id=jsonMsg class=muted></span>
  </div>
  <textarea id=js placeholder='{"v":6,"cursos":[...]}'></textarea>
  <div class=row style="margin-top:8px">
    <button onclick="doImportJSON('add')">Agregar cursos</button>
    <button class=ghost onclick="doImportJSON('replace')">Reemplazar todo</button>
    <button class=ghost onclick="closeModal()">Cancelar</button>
  </div>`;

function readJSONModal(inp){
 const f=inp.files[0];if(!f)return;
 const msg=$('#jsonMsg');if(msg)msg.textContent='Leyendo…';
 const r=new FileReader();
 r.onload=e=>{
  try{
   const o=JSON.parse(e.target.result);
   if(!o.cursos)throw new Error('sin cursos');
   $('#js').value=JSON.stringify(o);
   if(msg)msg.textContent='Leído. Elegí Agregar o Reemplazar.';
  }catch(x){if(msg)msg.textContent='Error: '+x.message}
 };
 r.readAsText(f);
}
function doImportJSON(modo){
 try{
  const o=JSON.parse(document.getElementById('js').value);
  if(!o.cursos||!Array.isArray(o.cursos))throw new Error('sin cursos');
  pushH();
  if(modo==='replace'){
   if(!confirm('¿Reemplazar TODOS los cursos actuales con los del archivo?'))return;
   D=o;cur=0;save();render();closeModal();toast('Datos reemplazados: '+o.cursos.length+' cursos');
  }else{
   D.cursos=D.cursos||[];
   if(o.circuitos&&(!D.circuitos||!Object.keys(D.circuitos).length))D.circuitos=o.circuitos;
   let add=0,dup=0;
   o.cursos.forEach(nc=>{
    const existe=D.cursos.find(x=>x.id===nc.id)||D.cursos.find(x=>(x.nombre||'').toLowerCase()===(nc.nombre||'').toLowerCase()&&(x.anio==nc.anio));
    if(existe)dup++;else{D.cursos.push(nc);add++}
   });
   cur=D.cursos.length-1;
   save();render();closeModal();
   toast('Agregados '+add+' cursos'+(dup?', '+dup+' ya existían':''));
  }
 }catch(e){toast('JSON inválido: '+e.message)}
}

// --- Publicar padres (descarga JSON, sin Firebase) ---
const PUB_E=new TextEncoder();
const pubB64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function pubSha(s){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',PUB_E.encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,20)}
async function pubKey(code,salt){const k=await crypto.subtle.importKey('raw',PUB_E.encode(code),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt'])}
async function pubSeal(code,o){const s=crypto.getRandomValues(new Uint8Array(16)),i=crypto.getRandomValues(new Uint8Array(12));return{s:pubB64(s),i:pubB64(i),c:pubB64(await crypto.subtle.encrypt({name:'AES-GCM',iv:i},await pubKey(code,s),PUB_E.encode(JSON.stringify(o))))}}
function pubPayload(c,s){
 let p=0,a=0,t=0;const last=[];
 Object.keys(c.asistencia||{}).sort().forEach(d=>{const v=(c.asistencia||{})[d]?.[s.id];if(v){v==='P'?p++:v==='A'?a++:t++;last.push([d,v])}});
 let materias;
 if(c.materias&&c.materias.length){
  materias=c.materias.map(m=>{
   const notas=m.evaluaciones.map(e=>[e.tema+(e.tipo?' · '+e.tipo:''),(c.notas||{})[s.id]?.[e.id]]).filter(x=>x[1]!==undefined&&x[1]!==''&&x[1]!==null);
   const prac=(m.practicas||[]).map(pr=>{
    const hechos=(c.practicasHechas||{})[s.id]||[];
    const partes=[...Array(pr.partes)].map((_,i)=>hechos.includes('pt_morza_'+(i+1)));
    return {nombre:pr.nombre, partes, total:pr.partes};
   });
   const cie={};
   (m.cierres||[]).forEach(k=>{const v=(c.cierres||{})[s.id]?.[m.id+'_'+k];if(v!=null&&v!=='')cie[k]=v});
   return {id:m.id,nombre:m.nombre,notas,practicas:prac,cierres:cie};
  });
 }else{
  const gr=(c.evaluaciones||[]).map(e=>[e.tema+(e.tipo?' · '+e.tipo:''),(c.notas||{})[s.id]?.[e.id]]).filter(x=>x[1]!==undefined&&x[1]!=='');
  const circ=catArr().map(x=>[x.nro+' — '+x.nombre,(circHechos(c,s.id)).includes('c'+String(x.nro).padStart(2,'0'))]);
  const cie=(c.cierres||{})[s.id]||{};
  materias=[{id:'unica',nombre:c.materia||'Materia',notas:gr,practicas:[],cierres:cie,circuitos:circ}];
 }
 return{n:s.nombre,c:c.nombre,u:td(),p,a,t,last:last.slice(-12).reverse(),materias};
}
async function publicarPadres(){
 if(!D||!D.cursos.length){toast('No hay cursos');return}
 toast('Generando…');
 const snap={};
 for(const c of D.cursos)for(const s of (c.alumnos||[])){
  if(!s.codigo)continue;
  snap[await pubSha('i:'+s.codigo)]=await pubSeal(s.codigo,pubPayload(c,s));
 }
 const payload={v:1,generado:new Date().toISOString(),snap};
 const a=document.createElement('a');
 a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(payload));
 a.download='datos-padres.json';a.click();
 toast('Descargado datos-padres.json — subilo junto a index.html');
}
