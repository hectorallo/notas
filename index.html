<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguimiento del alumno</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#e1e5ea;--ac:#2a62d9;--ok:#1f9d55;--no:#d64545;--wa:#d9890f;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181e;--card:#1d232c;--tx:#e8ecf1;--mu:#93a0b1;--bd:#2c3542;--ac:#6b95f0;--ok:#43c27a;--no:#f07070;--wa:#e9a73e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.muted{color:var(--mu);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;text-transform:uppercase;letter-spacing:1px;font-weight:700;font-family:ui-monospace,Consolas,monospace}
button{font:inherit;cursor:pointer;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700}
button.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.big{font-size:30px;font-weight:700;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;text-align:center;margin-top:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.ok{color:var(--ok);font-weight:600}.no{color:var(--no);font-weight:600}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.pill{display:inline-block;padding:2px 8px;border-radius:9px;font-size:13px;background:var(--bd);color:var(--mu);margin:2px}
.pill.no{background:rgba(214,69,69,.15);color:var(--no)}
#msg{min-height:18px;font-size:13px;color:var(--mu)}
footer{text-align:center;margin-top:30px}
a{color:var(--ac)}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fd=d=>d?d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4).slice(2):'';
const E=new TextEncoder(),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha(s){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',E.encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,20)}
async function key(code,salt){const k=await crypto.subtle.importKey('raw',E.encode(code),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])}
async function unseal(code,e){return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(e.i)},await key(code,ub(e.s)),ub(e.c))))}

let SNAP=null,GEN=null;
async function loadSnap(){
 try{
  const r=await fetch('/api/leer',{cache:'no-store'});
  if(!r.ok){SNAP=null;GEN=null;return}
  const j=await r.json();
  SNAP=j.snap||j;
  GEN=j.generado||null;
 }catch(e){SNAP=null;GEN=null}
}
function pantallaInicio(){
 let sv='';try{sv=localStorage.getItem('pcod')||''}catch(e){}
 $('#app').innerHTML=`
 <h1>🎓 Seguimiento del alumno</h1>
 <p class=muted>Ingresá el código que te entregó el docente.</p>
 <div class=card>
  <div class=row>
   <input id=cd value="${esc(sv)}" placeholder="XXXX-XXXX" maxlength="9" style="flex:1">
   <button onclick="ver()">Ver</button>
  </div>
  <p id=msg></p>
 </div>
 <div id=rep></div>
 <footer class=muted>
  ${GEN?'Última actualización: '+new Date(GEN).toLocaleString('es-AR'):''}<br>
  Si no tenés el código, pedíselo al docente del curso.
 </footer>`;
 if(sv)ver();
}
async function ver(){
 const code=$('#cd').value.toUpperCase().replace(/[^A-Z0-9]/g,''),m=$('#msg');
 if(!code){m.textContent='Escribí el código.';return}
 if(code.length!==8){m.textContent='El código tiene 8 caracteres (XXXX-XXXX).';return}
 if(!SNAP){await loadSnap();if(!SNAP){m.textContent='Todavía no hay información publicada.';return}}
 m.textContent='Buscando…';
 try{
  const h=await sha('i:'+code);
  const e=SNAP[h];
  if(!e){m.textContent='Código no encontrado. Revisalo e intentá de nuevo.';$('#rep').innerHTML='';return}
  const p=await unseal(code,e);
  m.textContent='';
  try{localStorage.setItem('pcod',code)}catch(x){}
  mostrar(p);
 }catch(x){m.textContent='Código no válido.'}
}
function mostrar(p){
 const tot=p.p+p.a+p.t,pc=tot?Math.round((p.p+p.t)/tot*100):0;
 const circH=p.circ.filter(x=>x[1]).length,circT=p.circ.length,circP=circT?Math.round(circH/circT*100):0;
 const temasNoAprob=[...new Set((p.gr||[]).map(x=>x[0].split(' · ')[0]))].filter(t=>{
   const vals=(p.gr||[]).filter(x=>x[0].startsWith(t+' · '));
   let best=null;vals.forEach(v=>{const n=parseFloat(String(v[1]).replace(',','.'));if(!isNaN(n)&&(best==null||n>best))best=n});
   return best==null||best<6;
 });
 let h=`<h1>${esc(p.n)}</h1><p class=muted style="margin-bottom:10px">${esc(p.c)} · actualizado ${fd(p.u)}</p>`;
 h+=`<div class=card><h2>Asistencia</h2>
  <div class=grid>
   <div><div class="big ${pc<75?'no':'ok'}">${pc}%</div><div class=muted>asistencia</div></div>
   <div><div class=big>${p.p}</div><div class=muted>presentes</div></div>
   <div><div class="big no">${p.a}</div><div class=muted>ausentes</div></div>
   <div><div class=big>${p.t}</div><div class=muted>tarde</div></div>
  </div>
  <p class=muted style="margin-top:10px">Últimos días: ${p.last.length?p.last.map(x=>fd(x[0])+' '+({P:'✔',A:'✘',T:'⏱'}[x[1]]||'')).join(' · '):'—'}</p>
 </div>`;
 if(circT){
  h+=`<div class=card><h2>Circuitos</h2>
   <p>Realizados: <b>${circH}</b> de <b>${circT}</b></p>
   <div class=bar><i style="width:${circP}%"></i></div>
   ${p.circ.map(x=>`<div class=item><span>${esc(x[0])}</span><span class="${x[1]?'ok':'muted'}">${x[1]?'✔ Hecho':'Pendiente'}</span></div>`).join('')}
  </div>`;
 }
 h+=`<div class=card><h2>Notas</h2>`;
 if(p.gr&&p.gr.length){
  h+=p.gr.map(x=>`<div class=item><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('');
 }else{
  h+='<p class=muted>Sin notas cargadas aún.</p>';
 }
 h+='</div>';
 if(temasNoAprob.length){
  h+=`<div class=card><h2>Temas a recuperar</h2>
   <p class=muted>Temas donde la mejor nota no llega a 6, o no hay nota.</p>
   ${temasNoAprob.map(t=>`<span class="pill no">${esc(t)}</span>`).join('')}
  </div>`;
 }
 if(p.cie&&Object.keys(p.cie).length){
  h+=`<div class=card><h2>Cierres</h2>${Object.entries(p.cie).map(([k,v])=>`<div class=item><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>`;
 }
 h+=`<div class=card style="text-align:center"><button class=ghost onclick="salir()">Consultar otro código</button></div>`;
 $('#app').innerHTML=h;
}
function salir(){try{localStorage.removeItem('pcod')}catch(e){}$('#app').innerHTML='';pantallaInicio()}
(async()=>{await loadSnap();pantallaInicio()})();
</script></body></html>
