<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguimiento del alumno</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#e1e5ea;--ac:#2a62d9;--ok:#1f9d55;--no:#d64545;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181e;--card:#1d232c;--tx:#e8ecf1;--mu:#93a0b1;--bd:#2c3542;--ac:#6b95f0;--ok:#43c27a;--no:#f07070;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,sans-serif}
#app{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.muted{color:var(--mu);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;text-transform:uppercase;letter-spacing:1px;font-weight:700;font-family:ui-monospace,Consolas,monospace}
button{font:inherit;cursor:pointer;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700}
button.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.big{font-size:30px;font-weight:700;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;text-align:center;margin-top:8px}
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.ok{color:var(--ok);font-weight:600}.no{color:var(--no);font-weight:600}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.pill{display:inline-block;padding:2px 8px;border-radius:9px;font-size:13px;background:var(--bd);color:var(--mu);margin:2px}
.pill.no{background:rgba(214,69,69,.15);color:var(--no)}
#msg{min-height:18px;font-size:13px;color:var(--mu)}
footer{text-align:center;margin-top:30px;color:var(--mu);font-size:14px}
</style></head><body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyACd2JBn-8HG7r0ogwEhuVrpy4_eVkY5f0",
  authDomain: "notas-93bb4.firebaseapp.com",
  projectId: "notas-93bb4",
  storageBucket: "notas-93bb4.firebasestorage.app",
  messagingSenderId: "186336063064",
  appId: "1:186336063064:web:a708dd17f06e8dd95b242d"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fd=d=>d?d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4).slice(2):'';
const E=new TextEncoder(),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha(s){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',E.encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,20)}
async function key(code,salt){const k=await crypto.subtle.importKey('raw',E.encode(code),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])}
async function unseal(code,e){return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(e.i)},await key(code,ub(e.s)),ub(e.c))))}

let SNAP=null,GEN=null;
async function loadSnap(){
 try{const snap=await getDoc(doc(db,'datos','padres'));if(snap.exists()){const j=snap.data();SNAP=j.snap;GEN=j.generado}else{SNAP=null;GEN=null}}catch(e){SNAP=null;GEN=null}
}
function inicio(){
 let sv='';try{sv=localStorage.getItem('pcod')||''}catch(e){}
 $('#app').innerHTML=`<h1>🎓 Seguimiento del alumno</h1><p class=muted>Ingresá el código.</p><div class=card><div class=row><input id=cd value="${esc(sv)}" placeholder="XXXX-XXXX" maxlength="9" style="flex:1"><button onclick="ver()">Ver</button></div><p id=msg></p></div><div id=rep></div><footer>${GEN?'Última actualización: '+new Date(GEN).toLocaleString('es-AR'):''}<br>Si no tenés el código, pedíselo al docente.</footer>`;
 if(sv)ver();
}
window.ver=async()=>{
 const code=$('#cd').value.toUpperCase().replace(/[^A-Z0-9]/g,''),m=$('#msg');
 if(code.length!==8){m.textContent='El código tiene 8 caracteres.';return}
 if(!SNAP){await loadSnap();if(!SNAP){m.textContent='No hay datos publicados.';return}}
 m.textContent='Buscando…';
 try{const h=await sha('i:'+code);const e=SNAP[h];if(!e){m.textContent='Código no encontrado.';return}const p=await unseal(code,e);m.textContent='';try{localStorage.setItem('pcod',code)}catch(x){};mostrar(p)}catch(x){m.textContent='Código no válido.'}
}
function mostrar(p){
 const tot=p.p+p.a+p.t,pc=tot?Math.round((p.p+p.t)/tot*100):0;
 let h=`<h1>${esc(p.n)}</h1><p class=muted style="margin-bottom:10px">${esc(p.c)} · ${fd(p.u)}</p>`;
 h+=`<div class=card><h2>Asistencia</h2><div class=grid><div><div class="big ${pc<75?'no':'ok'}">${pc}%</div><div class=muted>asistencia</div></div><div><div class=big>${p.p}</div><div class=muted>presentes</div></div><div><div class="big no">${p.a}</div><div class=muted>ausentes</div></div><div><div class=big>${p.t}</div><div class=muted>tarde</div></div></div><p class=muted style="margin-top:10px">Últimos días: ${p.last.map(x=>fd(x[0])+' '+({P:'✔',A:'✘',T:'⏱'}[x[1]]||'')).join(' · ')||'—'}</p></div>`;
 (p.materias||[]).forEach(m=>{
  h+=`<div class=card><h2>${esc(m.nombre)}</h2>`;
  if(m.circuitos&&m.circuitos.length){
   const he=m.circuitos.filter(x=>x[1]).length,tot=m.circuitos.length;
   h+=`<p>Circuitos: <b>${he}</b> de <b>${tot}</b></p><div class=bar><i style="width:${tot?Math.round(he/tot*100):0}%"></i></div>`;
   h+=m.circuitos.map(x=>`<div class=item><span>${esc(x[0])}</span><span class="${x[1]?'ok':'muted'}">${x[1]?'✔':'Pendiente'}</span></div>`).join('');
  }
  if(m.notas&&m.notas.length){
   h+=`<div style="margin-top:8px"><b>Notas</b></div>`;
   h+=m.notas.map(x=>`<div class=item><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('');
  }else h+='<p class=muted>Sin notas.</p>';
  if(m.practicas&&m.practicas.length){
   m.practicas.forEach(pr=>{
    const hechas=pr.partes.filter(Boolean).length;
    h+=`<div style="margin-top:10px"><b>${esc(pr.nombre)}</b>: ${hechas}/${pr.total}</div><div class=bar><i style="width:${Math.round(hechas/pr.total*100)}%"></i></div><div class=row style="flex-wrap:wrap;margin-top:4px">`;
    pr.partes.forEach((ok,i)=>h+=`<span class="pill ${ok?'':'no'}">P${i+1}</span>`);
    h+='</div>';
   });
  }
  if(m.cierres&&Object.keys(m.cierres).length){
   h+='<div style="margin-top:10px"><b>Cierres</b></div>';
   h+=Object.entries(m.cierres).map(([k,v])=>`<div class=item><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  }
  h+='</div>';
 });
 h+=`<div class=card style="text-align:center"><button class=ghost onclick="salir()">Consultar otro código</button></div>`;
 $('#app').innerHTML=h;
}
window.salir=()=>{try{localStorage.removeItem('pcod')}catch(e){}$('#app').innerHTML='';inicio()}
(async()=>{await loadSnap();inicio()})();
</script></body></html>
